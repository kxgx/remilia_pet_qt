name: 静态编译（本地 Runner）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_installer:
        description: '构建 Inno Setup 安装器'
        type: boolean
        default: false

jobs:
  static:
    name: Windows x64 静态版
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v5

      - name: 添加 Git usr/bin 到 PATH（缓存 gzip 依赖）
        run: echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 清理源码（保留 dist-static）
        run: |
          git clean -xdf -e dist-static

      - name: 配置 CMake
        run: |
          New-Item -ItemType Directory -Force -Path E:/remilia_build
          cmake -B E:/remilia_build/static -S . -G "Visual Studio 17 2022" -T version=14.44 `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_TOOLCHAIN_FILE="E:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: 编译
        run: cmake --build E:/remilia_build/static --config Release --parallel

      - name: 打包 zip
        run: |
          New-Item -ItemType Directory -Force -Path dist-static
          Copy-Item E:/remilia_build/static/Release/*.exe dist-static/
          Compress-Archive -Path dist-static/* -DestinationPath dist-static/RemiliaPet_Qt6-win-x64-static.zip

      - name: 构建安装器
        if: inputs.build_installer || startsWith(github.ref, 'refs/tags/')
        run: |
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "未找到 Inno Setup: $iscc"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist-static/installer
          & $iscc installer.iss /O"dist-static/installer"

      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-win-x64-static
          path: dist-static/

  release:
    name: 发布
    needs: [static]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: RemiliaPet_Qt6-win-x64-static
      - name: 重命名为英文（防 GitHub 吞中文）
        run: |
          ls -la
          # 安装器重命名
          mv installer/*.exe installer/RemiliaPet_Qt6-windows-x64-static-Setup.exe
          # 解压便携 exe 单独上传
          unzip -q RemiliaPet_Qt6-win-x64-static.zip "*.exe" -d portable/
          mv portable/*.exe RemiliaPet_Qt6-windows-x64-static.exe
          ls -la
          ls -la installer/ 2>/dev/null || true
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RemiliaPet_Qt6-win-x64-static.zip
            RemiliaPet_Qt6-windows-x64-static.exe
            installer/RemiliaPet_Qt6-windows-x64-static-Setup.exe
          draft: false
          prerelease: false
          make_latest: false

      - name: 发布到 Gitee Release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}

          # 创建 Release
          RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/xingguangk/remilia_pet_qt/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${{ secrets.GITEE_TOKEN }}\",\"tag_name\":\"$TAG\",\"name\":\"v$VERSION\",\"body\":\"Windows x64 静态编译版本\",\"target_commitish\":\"master\"}")
          echo "Create release: $RESP"
          RELEASE_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          # 上传文件
          for FILE in RemiliaPet_Qt6-win-x64-static.zip RemiliaPet_Qt6-windows-x64-static.exe; do
            echo "Uploading $FILE..."
            curl -s -X POST "https://gitee.com/api/v5/repos/xingguangk/remilia_pet_qt/releases/$RELEASE_ID/attach_files" \
              -F "access_token=${{ secrets.GITEE_TOKEN }}" \
              -F "file=@$FILE"
          done

          # 上传安装器（如果有）
          if [ -f "installer/RemiliaPet_Qt6-windows-x64-static-Setup.exe" ]; then
            echo "Uploading installer..."
            curl -s -X POST "https://gitee.com/api/v5/repos/xingguangk/remilia_pet_qt/releases/$RELEASE_ID/attach_files" \
              -F "access_token=${{ secrets.GITEE_TOKEN }}" \
              -F "file=@installer/RemiliaPet_Qt6-windows-x64-static-Setup.exe"
          fi

          echo "✅ Gitee Release 发布完成"
