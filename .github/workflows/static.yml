name: 静态编译（NAS MXE 交叉编译）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  static:
    name: Windows x64 静态版 (MXE)
    runs-on: [self-hosted, Linux, X64, nas]
    steps:
      - uses: actions/checkout@v5

      - name: 配置 CMake (MXE 交叉编译)
        run: |
          cmake -B build/static -S . \
            -DCMAKE_TOOLCHAIN_FILE=/opt/mxe/usr/x86_64-w64-mingw32.static/share/cmake/mxe-conf.cmake \
            -DSTATIC_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build/static --parallel $(nproc)

      - name: 打包 zip
        run: |
          mkdir -p dist-static
          # 重命名 exe 为英文
          cp build/static/*.exe dist-static/RemiliaPet_Qt6-windows-x64-static.exe 2>/dev/null || cp build/static/Release/*.exe dist-static/RemiliaPet_Qt6-windows-x64-static.exe 2>/dev/null || true
          ls -la dist-static/
          cd dist-static && zip ../RemiliaPet_Qt6-win-x64-static.zip *.exe && cd ..
          mv RemiliaPet_Qt6-win-x64-static.zip dist-static/

      - name: 构建 NSIS 安装器
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp installer.nsi .
          makensis installer.nsi
          mkdir -p dist-static/installer
          mv RemiliaPet_Qt6-windows-x64-static-Setup.exe dist-static/installer/

      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-win-x64-static
          path: dist-static/

  release:
    name: 发布
    needs: [static]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: RemiliaPet_Qt6-win-x64-static
      - name: 重命名为英文（防 GitHub 吞中文）
        run: |
          ls -la
          # 从 zip 解出便携 exe
          unzip -q RemiliaPet_Qt6-win-x64-static.zip "*.exe" -d portable/
          mv portable/*.exe RemiliaPet_Qt6-windows-x64-static.exe 2>/dev/null || true
          ls -la
          ls -la installer/ 2>/dev/null || true
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RemiliaPet_Qt6-win-x64-static.zip
            RemiliaPet_Qt6-windows-x64-static.exe
            installer/RemiliaPet_Qt6-windows-x64-static-Setup.exe
          draft: false
          prerelease: false
          make_latest: false
