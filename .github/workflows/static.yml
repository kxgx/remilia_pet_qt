name: 静态编译（本地runner）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  static:
    name: Windows x64 静态版
    runs-on: [self-hosted, Windows, X64, nas]
    steps:
      - uses: actions/checkout@v5

      - name: 添加 Git usr/bin 到 PATH
        run: echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 清理源码（保留 dist-static）
        run: git clean -xdf -e dist-static

      - name: 配置 CMake
        run: |
          New-Item -ItemType Directory -Force -Path C:/remilia_build
          cmake -B C:/remilia_build/static -S . -G "Visual Studio 17 2022" -T version=14.44 `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: 编译
        run: cmake --build C:/remilia_build/static --config Release --parallel

      - name: 打包 zip
        run: |
          New-Item -ItemType Directory -Force -Path dist-static
          Copy-Item C:/remilia_build/static/Release/*.exe dist-static/
          Compress-Archive -Path dist-static/* -DestinationPath dist-static/RemiliaPet_Qt6-win-x64-static.zip

      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-win-x64-static
          path: dist-static/

  release:
    name: 发布
    needs: [static]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: RemiliaPet_Qt6-win-x64-static
      - name: 重命名为英文
        run: |
          unzip -q RemiliaPet_Qt6-win-x64-static.zip "*.exe" -d portable/
          mv portable/*.exe RemiliaPet_Qt6-windows-x64-static.exe
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RemiliaPet_Qt6-win-x64-static.zip
            RemiliaPet_Qt6-windows-x64-static.exe
          draft: false
          prerelease: false
          make_latest: false

#      - name: 发布到 Gitee Release
