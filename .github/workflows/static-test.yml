name: 静态编译测试 (NAS MXE)

on:
  workflow_dispatch:

jobs:
  static-test:
    name: 编译测试
    runs-on: [self-hosted, Linux, X64, nas]
    steps:
      - uses: actions/checkout@v5

      - name: 安装 ccache
        run: sudo apt install -y ccache

      - name: 配置 CMake (MXE 交叉编译)
        run: |
          cmake -B build/static -S . \
            -DCMAKE_TOOLCHAIN_FILE=/opt/mxe/usr/x86_64-w64-mingw32.static/share/cmake/mxe-conf.cmake \
            -DSTATIC_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 编译
        run: cmake --build build/static --parallel $(nproc)

      - name: ccache 统计
        run: ccache -s

      - name: 构建 NSIS 安装器
        run: |
          cp installer.nsi .
          makensis installer.nsi
          mkdir -p dist-static/installer
          mv RemiliaPet_Qt6-windows-x64-static-Setup.exe dist-static/installer/

      - name: 列出产物
        run: |
          echo "=== 编译产物 ==="
          find build/static -name "*.exe" -ls
          echo "=== 安装器 ==="
          ls -la dist-static/installer/

      - name: 上传测试构件
        uses: actions/upload-artifact@v6
        with:
          name: test-exe
          path: |
            build/static/*.exe
            dist-static/
