name: 同步到极狐GitLab

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 推送到极狐GitLab
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add jihulab https://oauth2:${{ secrets.JIHULAB_TOKEN }}@jihulab.com/kxgx/remilia_pet_qt.git
          git push jihulab master --force
          git push jihulab --tags --force
