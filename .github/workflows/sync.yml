name: 同步到极狐GitLab

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到极狐GitLab
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add jihulab https://oauth2:${{ secrets.JIHULAB_TOKEN }}@jihulab.com/kxgx/remilia_pet_qt.git
          git fetch jihulab master
          git merge jihulab/master --allow-unrelated-histories -m "merge: 同步 GitHub → 极狐" || true
          git push jihulab master
          git push jihulab --tags
