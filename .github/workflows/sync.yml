name: 多仓同步

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 同步到极狐GitLab
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add jihulab https://oauth2:${{ secrets.JIHULAB_TOKEN }}@jihulab.com/kxgx/remilia_pet_qt.git
          git fetch jihulab master
          git checkout -b sync-tmp FETCH_HEAD
          git merge origin/master -X ours -m "sync: GitHub → 极狐"
          git push jihulab sync-tmp:master
          git push jihulab --tags --force || echo "tag force push failed (may be protected), continuing..."

      - name: 同步到Gitee
        run: |
          git remote add gitee https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/kxgx/remilia_pet_qt.git
          git push gitee master --force
          git push gitee --tags --force
