name: 约束检查

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # ============================================================
      # 一、QSettings & 代码约束
      # ============================================================
      - name: 1. 检查 main.cpp 中 orgName/appName 已设置
        run: |
          grep -q 'setOrganizationName' src/main.cpp || { echo "FAIL: setOrganizationName missing in main.cpp"; exit 1; }
          grep -q 'setApplicationName'  src/main.cpp || { echo "FAIL: setApplicationName missing in main.cpp"; exit 1; }
          echo "OK: orgName/appName set"

      - name: 2. 检查 aboutToQuit 已连接 saveSettings
        run: |
          grep -q 'aboutToQuit.*saveSettings' src/petwindow.cpp || { echo "FAIL: aboutToQuit→saveSettings not connected"; exit 1; }
          echo "OK: aboutToQuit→saveSettings connected"

      - name: 3. 检查 loadSettings 未调用 toggle 函数
        run: |
          awk '/^void DesktopPet::loadSettings/,/^}/' src/petwindow.cpp > /tmp/load.txt
          if grep -q 'toggleMouseTransparent\|toggleStayOnTop' /tmp/load.txt; then
            echo "FAIL: loadSettings calls toggle function — use applyXxx() instead"
            exit 1
          fi
          echo "OK: loadSettings uses applyXxx(), not toggleXxx()"

      - name: 4. 检查 saveSettings 调用了 s.sync()
        run: |
          awk '/^void DesktopPet::saveSettings/,/^}/' src/petwindow.cpp > /tmp/save.txt
          grep -q '\.sync()' /tmp/save.txt || { echo "FAIL: saveSettings missing s.sync()"; exit 1; }
          echo "OK: saveSettings calls sync()"

      - name: 5. 检查位置验证使用 qBound 而非拒绝
        run: |
          awk '/^void DesktopPet::loadSettings/,/^}/' src/petwindow.cpp > /tmp/load.txt
          grep -q 'qBound' /tmp/load.txt || { echo "FAIL: loadSettings missing qBound (clamp), may still use reject logic"; exit 1; }
          echo "OK: loadSettings uses clamp (qBound)"

      - name: 6. 检查托盘提示为固定字符串
        run: |
          awk '/^void DesktopPet::applyMouseTransparent/,/^}/' src/petwindow.cpp > /tmp/mouse.txt
          if grep -q 'setToolTip.*m_mouseTransparent\|m_mouseTransparent.*setToolTip' /tmp/mouse.txt; then
            echo "FAIL: tray tooltip has conditional suffix — should be fixed string"
            exit 1
          fi
          echo "OK: tray tooltip is fixed string"

      - name: 7. 检查 macOS 使用 CGWindowLevelForKey
        run: |
          grep -q 'CGWindowLevelForKey' src/petwindow.cpp || { echo "FAIL: macOS topmost must use CGWindowLevelForKey, not hardcoded 5"; exit 1; }
          echo "OK: CGWindowLevelForKey used"

      - name: 8. 检查音频使用 miniaudio/AudioPlayer 而非 Qt Multimedia
        run: |
          grep -q 'AudioPlayer' src/petwindow.h || { echo "FAIL: must use AudioPlayer (miniaudio) for audio"; exit 1; }
          if grep -q 'QSoundEffect\|QMediaPlayer\|QAudioOutput' src/petwindow.h; then echo "FAIL: QSoundEffect/QMediaPlayer/QAudioOutput must be removed (use AudioPlayer)"; exit 1; fi
          if grep -q 'Qt6::Multimedia' CMakeLists.txt; then echo "FAIL: CMakeLists.txt must not link Qt6::Multimedia"; exit 1; fi
          echo "OK: AudioPlayer (miniaudio) used, no Qt Multimedia"

      # ============================================================
      # 二、资源目录跨平台路径
      # ============================================================
      - name: 9. 检查 m_resourceDir 使用 GenericDataLocation
        run: |
          grep -q StandardPaths.*GenericDataLocation.*RemiliaPet/resources src/petwindow.cpp || { echo FAIL; exit 1; }
          echo OK

      - name: 10. 检查 loadOverrides 使用 GenericDataLocation
        run: |
          awk '/^void DesktopPet::loadOverrides/,/^}/' src/petwindow.cpp > /tmp/lo.txt
          grep -q StandardPaths.*GenericDataLocation /tmp/lo.txt || { echo FAIL; exit 1; }
          echo OK

      - name: 11. 检查 loadOverrides 优先使用 QStandardPaths
        run: |
          awk '/^void DesktopPet::loadOverrides/,/^}/' src/petwindow.cpp > /tmp/lo.txt
          grep -q 'QStandardPaths' /tmp/lo.txt || { echo FAIL: loadOverrides missing QStandardPaths as primary candidate; exit 1; }
          echo OK: loadOverrides has QStandardPaths + applicationDirPath fallbacks

      - name: 12. 检查 m_resourceDir 不再使用旧路径 applicationDirPath
        run: |
          if grep -q 'm_resourceDir.*applicationDirPath' src/petwindow.cpp; then echo FAIL: m_resourceDir still references applicationDirPath; exit 1; fi
          echo OK: m_resourceDir migrated to QStandardPaths

      - name: 13. 检查 openDirInFM 去除尾部斜杠
        run: |
          awk '/void openDirInFM/,/^}/' src/inappfiledialog.cpp > /tmp/oa.txt
          grep -q endsWith.*chop /tmp/oa.txt || { echo FAIL; exit 1; }
          echo OK

      - name: 14. 检查 onOpenAll 调用 mkpath
        run: |
          awk /void.onOpenAll/,/}/ src/petwindow.cpp > /tmp/oa.txt
          grep -q mkpath /tmp/oa.txt || { echo FAIL; exit 1; }
          echo OK

      - name: 15. 检查 QDesktopServices::openUrl（非 Linux fallback）
        run: |
          grep -q QDesktopServices::openUrl src/petwindow.cpp || { echo FAIL; exit 1; }
          echo OK

      # ============================================================
      # 三、CMake 约束
      # ============================================================
      - name: 16. 检查 macOS 图标使用 POST_BUILD 拷贝
        run: |
          grep -q 'POST_BUILD' CMakeLists.txt || { echo "FAIL: CMakeLists.txt missing POST_BUILD"; exit 1; }
          grep -q 'icon\.icns' CMakeLists.txt || { echo "FAIL: CMakeLists.txt missing icon.icns reference"; exit 1; }
          echo "OK: icon.icns POST_BUILD copy present"

      # ============================================================
      # 四、CI build.yml 约束
      # ============================================================
      - name: 17. 检查 Linux CI 包含 qt6-wayland
        run: |
          grep -q 'qt6-wayland' .github/workflows/build.yml || { echo "FAIL: build.yml missing qt6-wayland in apt deps"; exit 1; }
          echo "OK: qt6-wayland in CI deps"

      - name: 18. 检查 deb 包不再依赖 GStreamer
        run: |
          if grep -q 'gstreamer' .github/workflows/build.yml; then echo "FAIL: build.yml must not reference gstreamer (use miniaudio+WAV)"; exit 1; fi
          echo "OK: no GStreamer dependency, using miniaudio+WAV"

      - name: 19. 检查 Linux CI 使用 dpkg-deb 打包 .deb
        run: |
          grep -q 'dpkg-deb --build' .github/workflows/build.yml || { echo "FAIL: build.yml missing dpkg-deb --build ( .deb packaging)"; exit 1; }
          echo "OK: dpkg-deb --build present"

      - name: 20. 检查 Linux CI 使用 alien 转换 .rpm
        run: |
          grep -q 'alien -r' .github/workflows/build.yml || { echo "FAIL: build.yml missing alien -r ( .rpm conversion)"; exit 1; }
          echo "OK: alien -r present"

      - name: 21. 检查 build.yml 不再包含 Arch 打包 job
        run: |
          if grep -q 'linux-arch' .github/workflows/build.yml; then echo "FAIL: build.yml must not contain linux-arch jobs"; exit 1; fi
          echo "OK: no Arch packaging jobs"

      - name: 22. 检查打包 Wayland 完整插件链
        run: |
          grep -q 'qwayland' .github/workflows/build.yml || { echo "FAIL: build.yml missing qwayland platform plugin copy"; exit 1; }
          grep -q 'wayland-shell-integration' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-shell-integration sub-plugin"; exit 1; }
          grep -q 'wayland-graphics-integration-client' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-graphics-integration-client sub-plugin"; exit 1; }
          grep -q 'wayland-decoration-client' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-decoration-client sub-plugin"; exit 1; }
          grep -q 'libQt6WaylandEglClientHwIntegration' .github/workflows/build.yml || { echo "FAIL: build.yml missing libQt6WaylandEglClientHwIntegration"; exit 1; }
          echo "OK: full Wayland plugin chain bundled"

      - name: 23. 检查 .deb launcher 使用 usr/bin 路径 (FHS)
        run: |
          grep -q 'usr/bin/蕾米埃尔桌宠_Qt6' .github/workflows/build.yml || { echo "FAIL: .deb launcher must use usr/bin/ path"; exit 1; }
          echo "OK: .deb launcher points to usr/bin/"

      - name: 24. 检查 Linux launcher 使用 XCB 避免 Wayland 兼容问题
        run: |
          grep -q 'QT_QPA_PLATFORM=xcb' .github/workflows/build.yml || { echo "FAIL: Linux launcher must set QT_QPA_PLATFORM=xcb"; exit 1; }
          echo "OK: QT_QPA_PLATFORM=xcb set in all launchers"

      - name: 25. 检查 macOS CI 移除 aws/tap 避免 Homebrew 警告
        run: |
          grep -q 'brew untap aws/tap' .github/workflows/build.yml || { echo "FAIL: build.yml missing brew untap aws/tap"; exit 1; }
          echo "OK: aws/tap untap present"

      - name: 26. 检查 actions/* 官方版本 >= v5
        run: |
          if grep -qrE 'actions/[^@]+@v[1-4]\b' .github/workflows/; then echo "FAIL: actions/* version < v5 found"; grep -rnE 'actions/[^@]+@v[1-4]\b' .github/workflows/; exit 1; fi
          echo "OK: all actions/* >= v5"

      # ============================================================
      # 五、发布策略（#27-29）+ Unicode 字符码表（#30）
      # ============================================================
      - name: 27. 检查 build.yml 标记 latest（主 CI）
        run: |
          grep -q 'make_latest: true' .github/workflows/build.yml || { echo FAIL: build.yml must keep make_latest: true; exit 1; }
          echo OK: build.yml make_latest: true

      - name: 28. 检查 static.yml 不标记 latest
        run: |
          grep -q 'make_latest: false' .github/workflows/static.yml || { echo FAIL: static.yml must keep make_latest: false; exit 1; }
          echo OK: static.yml make_latest: false

      - name: 29. 检查所有版本号一致（CMakeLists + installer.iss + build.yml .deb + tag）
        run: |
          CMAKE_VER=$(grep 'project(RemiliaPet VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          ISS_VER=$(grep 'MyAppVersion' installer.iss | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          FAIL=0
          # 1. CMakeLists.txt ↔ installer.iss
          if [ "$CMAKE_VER" != "$ISS_VER" ]; then echo "FAIL: CMakeLists.txt=$CMAKE_VER installer.iss=$ISS_VER"; FAIL=1; fi
          # 2. CMakeLists.txt ↔ build.yml .deb DEBIAN/control Version
          for ver in $(grep '          Version:' .github/workflows/build.yml | sed 's/.*Version: *//'); do
            if [ "$ver" != "$CMAKE_VER" ]; then echo "FAIL: build.yml .deb Version:$ver != $CMAKE_VER"; FAIL=1; fi
          done
          # 3. 与 git tag 一致（仅 tag 触发时校验）
          TAG_VER=$(echo "$GITHUB_REF" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$TAG_VER" ] && [ "$TAG_VER" != "$CMAKE_VER" ]; then
            echo "FAIL: tag v$TAG_VER but project version is $CMAKE_VER"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "OK: all versions match $CMAKE_VER [tag=$TAG_VER]"

      - name: 30. 检查 Unicode 字符码表与源码一致
        run: |
          FAIL=0
          # Extract all fromUtf8 escape strings from all source files
          grep -oPh 'fromUtf8\("\K[^"]*(?="\))' src/*.cpp | sort -u > /tmp/code.txt
          echo "=== fromUtf8 ==="
          while read -r str; do
            [ -z "$str" ] && continue
            if ! grep -qF "$str" 项目约束文件.md; then
              echo "UNREGISTERED fromUtf8: $str"
              FAIL=1
            fi
          done < /tmp/code.txt
          if [ "$FAIL" = "1" ]; then
            echo "请更新 项目约束文件.md §1.15 Unicode 字符码表"
            exit 1
          fi
          echo "OK: Unicode 字符码表与源码一致 (fromUtf8:$(wc -l < /tmp/code.txt))"

      # ============================================================
      # 六、音频 QRC alias 同步检查
      # ============================================================
      - name: 31. 检查 QRC 音频 alias 与 preloadSounds 一致（均为 .wav 无 .mp3）
        run: |
          FAIL=0
          # 1. Extract audio filenames from preloadSounds
          grep '"start\.wav"' src/petwindow.cpp || { echo "FAIL: start.wav not found in preloadSounds"; FAIL=1; }
          # Extract all .wav files in preloadSounds list
          awk '/^void DesktopPet::preloadSounds/,/^}/' src/petwindow.cpp > /tmp/ps.txt
          wav_count=$(grep -oE '"[a-z]+\.wav"' /tmp/ps.txt | sort -u | wc -l)
          echo "preloadSounds .wav files: $wav_count (expect 7)"
          if [ "$wav_count" -ne 7 ]; then
            echo "FAIL: expected 7 .wav files in preloadSounds, found $wav_count"
            FAIL=1
          fi
          # 2. Verify QRC aliases: all audio aliases must be .wav, NOT .mp3
          if grep -q 'alias="audio/[^"]*\.mp3"' resources.qrc; then
            echo "FAIL: resources.qrc contains .mp3 audio aliases — must be .wav"
            grep 'alias="audio/[^"]*\.mp3"' resources.qrc
            FAIL=1
          fi
          # 3. Verify QRC has exactly 7 audio aliases with .wav
          alias_count=$(grep -c 'alias="audio/[^"]*\.wav"' resources.qrc || true)
          echo "QRC .wav aliases: $alias_count (expect 7)"
          if [ "$alias_count" -ne 7 ]; then
            echo "FAIL: expected 7 audio .wav aliases in resources.qrc, found $alias_count"
            FAIL=1
          fi
          # 4. Cross-check: every .wav in preloadSounds has matching QRC alias
          for f in $(grep -oE '"[a-z]+\.wav"' /tmp/ps.txt | tr -d '"' | sort -u); do
            if ! grep -q "alias=\"audio/$f\"" resources.qrc; then
              echo "FAIL: preloadSounds uses $f but no matching QRC alias found"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "请同步 resources.qrc alias 与 preloadSounds 中的音频扩展名（必须均为 .wav）"
            exit 1
          fi
          echo "OK: QRC audio aliases match preloadSounds (all .wav)"

      - name: 32. 检查 preloadSounds 有 QRC 提取失败的防御性日志
        run: |
          awk '/^void DesktopPet::preloadSounds/,/^}/' src/petwindow.cpp > /tmp/ps.txt
          # Must have qWarning on QRC open failure
          if ! grep -q 'qWarning.*preloadSounds.*QRC resource not found' /tmp/ps.txt; then
            echo "FAIL: preloadSounds must log qWarning when QRC resource not found"
            exit 1
          fi
          # Must have qWarning on temp file write failure
          if ! grep -q 'qWarning.*preloadSounds.*cannot write temp' /tmp/ps.txt; then
            echo "FAIL: preloadSounds must log qWarning when temp file write fails"
            exit 1
          fi
          # Must have qWarning when temp file still missing
          if ! grep -q 'qWarning.*preloadSounds.*temp file still missing' /tmp/ps.txt; then
            echo "FAIL: preloadSounds must log qWarning when temp file still missing"
            exit 1
          fi
          echo "OK: preloadSounds has defensive error logging"

      - name: 汇总
        run: echo "✅ 全部 32 项约束检查通过"
