name: 约束检查

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # ============ QSettings 持久化 ============
      - name: 1. 检查 main.cpp 中 orgName/appName 已设置
        run: |
          grep -q 'setOrganizationName' src/main.cpp || { echo "FAIL: setOrganizationName missing in main.cpp"; exit 1; }
          grep -q 'setApplicationName'  src/main.cpp || { echo "FAIL: setApplicationName missing in main.cpp"; exit 1; }
          echo "OK: orgName/appName set"

      - name: 2. 检查 aboutToQuit 已连接 saveSettings
        run: |
          grep -q 'aboutToQuit.*saveSettings' src/petwindow.cpp || { echo "FAIL: aboutToQuit→saveSettings not connected"; exit 1; }
          echo "OK: aboutToQuit→saveSettings connected"

      - name: 3. 检查 loadSettings 未调用 toggle 函数
        run: |
          awk '/^void DesktopPet::loadSettings/,/^}/' src/petwindow.cpp > /tmp/load.txt
          if grep -q 'toggleMouseTransparent\|toggleStayOnTop' /tmp/load.txt; then
            echo "FAIL: loadSettings calls toggle function — use applyXxx() instead"
            exit 1
          fi
          echo "OK: loadSettings uses applyXxx(), not toggleXxx()"

      - name: 4. 检查 saveSettings 调用了 s.sync()
        run: |
          awk '/^void DesktopPet::saveSettings/,/^}/' src/petwindow.cpp > /tmp/save.txt
          grep -q '\.sync()' /tmp/save.txt || { echo "FAIL: saveSettings missing s.sync()"; exit 1; }
          echo "OK: saveSettings calls sync()"

      - name: 5. 检查位置验证使用 qBound 而非拒绝
        run: |
          awk '/^void DesktopPet::loadSettings/,/^}/' src/petwindow.cpp > /tmp/load.txt
          grep -q 'qBound' /tmp/load.txt || { echo "FAIL: loadSettings missing qBound (clamp), may still use reject logic"; exit 1; }
          echo "OK: loadSettings uses clamp (qBound)"

      # ============ CMake ============
      - name: 6. 检查 macOS 图标使用 POST_BUILD 拷贝
        run: |
          grep -q 'POST_BUILD' CMakeLists.txt || { echo "FAIL: CMakeLists.txt missing POST_BUILD"; exit 1; }
          grep -q 'icon\.icns' CMakeLists.txt || { echo "FAIL: CMakeLists.txt missing icon.icns reference"; exit 1; }
          echo "OK: icon.icns POST_BUILD copy present"

      - name: 7. 检查 macOS 使用 CGWindowLevelForKey
        run: |
          grep -q 'CGWindowLevelForKey' src/petwindow.cpp || { echo "FAIL: macOS topmost must use CGWindowLevelForKey, not hardcoded 5"; exit 1; }
          echo "OK: CGWindowLevelForKey used"

      # ============ CI / build.yml ============
      - name: 8. 检查 Linux CI 包含 qt6-wayland
        run: |
          grep -q 'qt6-wayland' .github/workflows/build.yml || { echo "FAIL: build.yml missing qt6-wayland in apt deps"; exit 1; }
          echo "OK: qt6-wayland in CI deps"

      - name: 9. 检查 deb 包不再依赖 GStreamer（改用 QSoundEffect+WAV）
        run: |
          if grep -q 'gstreamer' .github/workflows/build.yml; then echo "FAIL: build.yml must not reference gstreamer (use QSoundEffect+WAV)"; exit 1; fi
          echo "OK: no GStreamer dependency, using QSoundEffect+WAV"

      - name: 10. 检查 Linux CI 使用 dpkg-deb 打包 .deb
        run: |
          grep -q 'dpkg-deb --build' .github/workflows/build.yml || { echo "FAIL: build.yml missing dpkg-deb --build ( .deb packaging)"; exit 1; }
          echo "OK: dpkg-deb --build present"

      - name: 11. 检查 Linux CI 使用 alien 转换 .rpm
        run: |
          grep -q 'alien -r' .github/workflows/build.yml || { echo "FAIL: build.yml missing alien -r ( .rpm conversion)"; exit 1; }
          echo "OK: alien -r present"

      - name: 12. 检查 Arch Linux x64 打包 .pkg.tar.zst
        run: |
          grep -q 'linux-arch:' .github/workflows/build.yml || { echo "FAIL: build.yml missing linux-arch job (Arch x64)"; exit 1; }
          echo "OK: arch x64 pkg.tar.zst job present"

      - name: 13. 检查 Arch Linux ARM64 打包 .pkg.tar.zst
        run: |
          grep -q 'linux-arch-arm64:' .github/workflows/build.yml || { echo "FAIL: build.yml missing linux-arch-arm64 job (Arch ARM64)"; exit 1; }
          echo "OK: arch arm64 pkg.tar.zst job present"

      - name: 14. 检查托盘提示为固定字符串
        run: |
          awk '/^void DesktopPet::applyMouseTransparent/,/^}/' src/petwindow.cpp > /tmp/mouse.txt
          if grep -q 'setToolTip.*m_mouseTransparent\|m_mouseTransparent.*setToolTip' /tmp/mouse.txt; then
            echo "FAIL: tray tooltip has conditional suffix — should be fixed string"
            exit 1
          fi
          echo "OK: tray tooltip is fixed string"

      - name: 15. 检查打包 Wayland 完整插件链（平台+子插件+库）
        run: |
          grep -q 'qwayland' .github/workflows/build.yml || { echo "FAIL: build.yml missing qwayland platform plugin copy"; exit 1; }
          grep -q 'wayland-shell-integration' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-shell-integration sub-plugin"; exit 1; }
          grep -q 'wayland-graphics-integration-client' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-graphics-integration-client sub-plugin"; exit 1; }
          grep -q 'wayland-decoration-client' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-decoration-client sub-plugin"; exit 1; }
          grep -q 'libQt6WaylandEglClientHwIntegration' .github/workflows/build.yml || { echo "FAIL: build.yml missing libQt6WaylandEglClientHwIntegration"; exit 1; }
          echo "OK: full Wayland plugin chain bundled (platform+shell+graphics+decoration+egl)"

      - name: 16. 检查 .deb launcher 使用 usr/bin 路径 (FHS)
        run: |
          grep -q 'usr/bin/蕾米埃尔桌宠_Qt6' .github/workflows/build.yml || { echo "FAIL: .deb launcher must use usr/bin/ path (linuxdeploy FHS)"; exit 1; }
          echo "OK: .deb launcher points to usr/bin/"

      - name: 17. 检查 Linux launcher 使用 XCB 避免 Wayland 兼容问题
        run: |
          grep -q 'QT_QPA_PLATFORM=xcb' .github/workflows/build.yml || { echo "FAIL: Linux launcher must set QT_QPA_PLATFORM=xcb (avoid Wayland shell integration issues)"; exit 1; }
          echo "OK: QT_QPA_PLATFORM=xcb set in all launchers"

      - name: 18. 检查 macOS CI 移除 aws/tap 避免 Homebrew 信任警告
        run: |
          grep -q 'brew untap aws/tap' .github/workflows/build.yml || { echo "FAIL: build.yml missing brew untap aws/tap to suppress Homebrew trust warning"; exit 1; }
          echo "OK: aws/tap untap present"

      - name: 19. 检查 Release 使用 download-artifact@v7 (Node 24)
        run: |
          grep -q 'actions/download-artifact@v7' .github/workflows/build.yml || { echo "FAIL: release job must use download-artifact@v7 (Node 24)"; exit 1; }
          if grep -q 'actions/download-artifact@v4' .github/workflows/build.yml; then echo "FAIL: found old download-artifact@v4 (Node 20)"; exit 1; fi
          echo "OK: download-artifact@v7 in release job"

      - name: 20. 检查音频使用 QSoundEffect 而非 QMediaPlayer
        run: |
          grep -q 'QSoundEffect' src/petwindow.h || { echo "FAIL: must use QSoundEffect for audio, not QMediaPlayer"; exit 1; }
          if grep -q 'QMediaPlayer\|QAudioOutput' src/petwindow.h; then echo "FAIL: QMediaPlayer/QAudioOutput must be replaced with QSoundEffect"; exit 1; fi
          echo "OK: QSoundEffect used for audio"

      - name: 21. 检查 Arch 包使用 bsdtar + .MTREE 生成
        run: |
          grep -q 'bsdtar.*pkg\.tar\.zst' .github/workflows/build.yml || { echo "FAIL: Arch packaging must use bsdtar (not GNU tar) for pacman compatibility"; exit 1; }
          grep -q 'libarchive-tools' .github/workflows/build.yml || { echo "FAIL: Arch CI deps must include libarchive-tools (provides bsdtar)"; exit 1; }
          grep -q '\.MTREE' .github/workflows/build.yml || { echo "FAIL: Arch package must generate .MTREE file (pacman integrity check)"; exit 1; }
          echo "OK: Arch uses bsdtar + .MTREE + libarchive-tools"

      - name: 22. 检查 Arch PKGINFO 格式正确（pkgbase/pkgrel 分离）
        run: |
          grep -q 'pkgbase = remilia-pet' .github/workflows/build.yml || { echo "FAIL: PKGINFO must include pkgbase field"; exit 1; }
          grep -q 'pkgrel = 1' .github/workflows/build.yml || { echo "FAIL: PKGINFO must include pkgrel field (separate from pkgver)"; exit 1; }
          echo "OK: PKGINFO has pkgbase + pkgrel fields"

      - name: 汇总
        run: echo "✅ 全部 22 项约束检查通过"
