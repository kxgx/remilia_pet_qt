name: 约束检查

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # ============================================================
      # 一、QSettings & 代码约束
      # ============================================================
      - name: 1. 检查 main.cpp 中 orgName/appName 已设置
        run: |
          grep -q 'setOrganizationName' src/main.cpp || { echo "FAIL: setOrganizationName missing in main.cpp"; exit 1; }
          grep -q 'setApplicationName'  src/main.cpp || { echo "FAIL: setApplicationName missing in main.cpp"; exit 1; }
          echo "OK: orgName/appName set"

      - name: 2. 检查 aboutToQuit 已连接 saveSettings
        run: |
          grep -q 'aboutToQuit.*saveSettings' src/petwindow.cpp || { echo "FAIL: aboutToQuit→saveSettings not connected"; exit 1; }
          echo "OK: aboutToQuit→saveSettings connected"

      - name: 3. 检查 loadSettings 未调用 toggle 函数
        run: |
          awk '/^void DesktopPet::loadSettings/,/^}/' src/petwindow.cpp > /tmp/load.txt
          if grep -q 'toggleMouseTransparent\|toggleStayOnTop' /tmp/load.txt; then
            echo "FAIL: loadSettings calls toggle function — use applyXxx() instead"
            exit 1
          fi
          echo "OK: loadSettings uses applyXxx(), not toggleXxx()"

      - name: 4. 检查 saveSettings 调用了 s.sync()
        run: |
          awk '/^void DesktopPet::saveSettings/,/^}/' src/petwindow.cpp > /tmp/save.txt
          grep -q '\.sync()' /tmp/save.txt || { echo "FAIL: saveSettings missing s.sync()"; exit 1; }
          echo "OK: saveSettings calls sync()"

      - name: 5. 检查位置验证使用 qBound 而非拒绝
        run: |
          awk '/^void DesktopPet::loadSettings/,/^}/' src/petwindow.cpp > /tmp/load.txt
          grep -q 'qBound' /tmp/load.txt || { echo "FAIL: loadSettings missing qBound (clamp), may still use reject logic"; exit 1; }
          echo "OK: loadSettings uses clamp (qBound)"

      - name: 6. 检查托盘提示为固定字符串
        run: |
          awk '/^void DesktopPet::applyMouseTransparent/,/^}/' src/petwindow.cpp > /tmp/mouse.txt
          if grep -q 'setToolTip.*m_mouseTransparent\|m_mouseTransparent.*setToolTip' /tmp/mouse.txt; then
            echo "FAIL: tray tooltip has conditional suffix — should be fixed string"
            exit 1
          fi
          echo "OK: tray tooltip is fixed string"

      - name: 7. 检查 macOS 使用 CGWindowLevelForKey
        run: |
          grep -q 'CGWindowLevelForKey' src/petwindow.cpp || { echo "FAIL: macOS topmost must use CGWindowLevelForKey, not hardcoded 5"; exit 1; }
          echo "OK: CGWindowLevelForKey used"

      - name: 8. 检查音频使用 miniaudio/AudioPlayer 而非 Qt Multimedia
        run: |
          grep -q 'AudioPlayer' src/petwindow.h || { echo "FAIL: must use AudioPlayer (miniaudio) for audio"; exit 1; }
          if grep -q 'QSoundEffect\|QMediaPlayer\|QAudioOutput' src/petwindow.h; then echo "FAIL: QSoundEffect/QMediaPlayer/QAudioOutput must be removed (use AudioPlayer)"; exit 1; fi
          if grep -q 'Qt6::Multimedia' CMakeLists.txt; then echo "FAIL: CMakeLists.txt must not link Qt6::Multimedia"; exit 1; fi
          echo "OK: AudioPlayer (miniaudio) used, no Qt Multimedia"

      # ============================================================
      # 二、资源目录跨平台路径
      # ============================================================
      - name: 9. 检查 m_resourceDir 使用 GenericDataLocation
        run: |
          grep -q StandardPaths.*GenericDataLocation.*RemiliaPet/resources src/petwindow.cpp || { echo FAIL; exit 1; }
          echo OK

      - name: 10. 检查 loadOverrides 使用 GenericDataLocation
        run: |
          awk '/^void DesktopPet::loadOverrides/,/^}/' src/petwindow.cpp > /tmp/lo.txt
          grep -q StandardPaths.*GenericDataLocation /tmp/lo.txt || { echo FAIL; exit 1; }
          echo OK

      - name: 11. 检查 loadOverrides 优先使用 QStandardPaths
        run: |
          awk '/^void DesktopPet::loadOverrides/,/^}/' src/petwindow.cpp > /tmp/lo.txt
          grep -q 'QStandardPaths' /tmp/lo.txt || { echo FAIL: loadOverrides missing QStandardPaths as primary candidate; exit 1; }
          echo OK: loadOverrides has QStandardPaths + applicationDirPath fallbacks

      - name: 12. 检查 m_resourceDir 不再使用旧路径 applicationDirPath
        run: |
          if grep -q 'm_resourceDir.*applicationDirPath' src/petwindow.cpp; then echo FAIL: m_resourceDir still references applicationDirPath; exit 1; fi
          echo OK: m_resourceDir migrated to QStandardPaths

      - name: 13. 检查 openDirInFM 去除尾部斜杠
        run: |
          awk '/void openDirInFM/,/^}/' src/inappfiledialog.cpp > /tmp/oa.txt
          grep -q 'endsWith' /tmp/oa.txt || { echo FAIL; exit 1; }
          grep -q 'chop(1)' /tmp/oa.txt || { echo FAIL; exit 1; }
          echo OK

      - name: 14. 检查 onOpenAll 调用 mkpath
        run: |
          awk '/void.*onOpenAll/,/^}/' src/resourcewindow.cpp > /tmp/oa.txt
          grep -q mkpath /tmp/oa.txt || { echo FAIL; exit 1; }
          echo OK

      - name: 15. 检查 QDesktopServices::openUrl（非 Linux fallback）
        run: |
          grep -q QDesktopServices::openUrl src/inappfiledialog.cpp || { echo FAIL; exit 1; }
          echo OK

      # ============================================================
      # 三、CMake 约束
      # ============================================================
      - name: 16. 检查 macOS 图标使用 POST_BUILD 拷贝
        run: |
          grep -q 'POST_BUILD' CMakeLists.txt || { echo "FAIL: CMakeLists.txt missing POST_BUILD"; exit 1; }
          grep -q 'icon\.icns' CMakeLists.txt || { echo "FAIL: CMakeLists.txt missing icon.icns reference"; exit 1; }
          echo "OK: icon.icns POST_BUILD copy present"

      # ============================================================
      # 四、CI build.yml 约束
      # ============================================================
      - name: 17. 检查 Linux CI 包含 qt6-wayland
        run: |
          grep -q 'qt6-wayland' .github/workflows/build.yml || { echo "FAIL: build.yml missing qt6-wayland in apt deps"; exit 1; }
          echo "OK: qt6-wayland in CI deps"

      - name: 18. 检查 deb 包不再依赖 GStreamer
        run: |
          if grep -q 'gstreamer' .github/workflows/build.yml; then echo "FAIL: build.yml must not reference gstreamer (use miniaudio+WAV)"; exit 1; fi
          echo "OK: no GStreamer dependency, using miniaudio+WAV"

      - name: 19. 检查 Linux CI 使用 dpkg-deb 打包 .deb
        run: |
          grep -q 'dpkg-deb --build' .github/workflows/build.yml || { echo "FAIL: build.yml missing dpkg-deb --build ( .deb packaging)"; exit 1; }
          echo "OK: dpkg-deb --build present"

      - name: 20. 检查 Linux CI 使用 alien 转换 .rpm
        run: |
          grep -q 'alien -r' .github/workflows/build.yml || { echo "FAIL: build.yml missing alien -r ( .rpm conversion)"; exit 1; }
          echo "OK: alien -r present"

      - name: 21. 检查 build.yml 不再包含 Arch 打包 job
        run: |
          if grep -q 'linux-arch' .github/workflows/build.yml; then echo "FAIL: build.yml must not contain linux-arch jobs"; exit 1; fi
          echo "OK: no Arch packaging jobs"

      - name: 22. 检查打包 Wayland 完整插件链
        run: |
          grep -q 'qwayland' .github/workflows/build.yml || { echo "FAIL: build.yml missing qwayland platform plugin copy"; exit 1; }
          grep -q 'wayland-shell-integration' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-shell-integration sub-plugin"; exit 1; }
          grep -q 'wayland-graphics-integration-client' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-graphics-integration-client sub-plugin"; exit 1; }
          grep -q 'wayland-decoration-client' .github/workflows/build.yml || { echo "FAIL: build.yml missing wayland-decoration-client sub-plugin"; exit 1; }
          grep -q 'libQt6WaylandEglClientHwIntegration' .github/workflows/build.yml || { echo "FAIL: build.yml missing libQt6WaylandEglClientHwIntegration"; exit 1; }
          echo "OK: full Wayland plugin chain bundled"

      - name: 23. 检查 .deb launcher 使用 usr/bin 路径 (FHS)
        run: |
          grep -q 'usr/bin/蕾米埃尔桌宠_Qt6' .github/workflows/build.yml || { echo "FAIL: .deb launcher must use usr/bin/ path"; exit 1; }
          echo "OK: .deb launcher points to usr/bin/"

      - name: 24. 检查 Linux launcher 使用 XCB 避免 Wayland 兼容问题
        run: |
          grep -q 'QT_QPA_PLATFORM=xcb' .github/workflows/build.yml || { echo "FAIL: Linux launcher must set QT_QPA_PLATFORM=xcb"; exit 1; }
          echo "OK: QT_QPA_PLATFORM=xcb set in all launchers"

      - name: 25. 检查 macOS CI 移除 aws/tap 避免 Homebrew 警告
        run: |
          grep -q 'brew untap aws/tap' .github/workflows/build.yml || { echo "FAIL: build.yml missing brew untap aws/tap"; exit 1; }
          echo "OK: aws/tap untap present"

      - name: 26. 检查 actions/* 官方版本 >= v5
        run: |
          if grep -qrE 'actions/[^@]+@v[1-4]\b' .github/workflows/; then echo "FAIL: actions/* version < v5 found"; grep -rnE 'actions/[^@]+@v[1-4]\b' .github/workflows/; exit 1; fi
          echo "OK: all actions/* >= v5"

      # ============================================================
      # 五、发布策略（#27-29）+ Unicode 字符码表（#30）
      # ============================================================
      - name: 27. 检查 build.yml 标记 latest（主 CI）
        run: |
          grep -q 'make_latest: true' .github/workflows/build.yml || { echo FAIL: build.yml must keep make_latest: true; exit 1; }
          echo OK: build.yml make_latest: true

      - name: 28. 检查 build.yml 静态版不标记 latest
        run: |
          grep -q 'make_latest: false' .github/workflows/build.yml || { echo FAIL: build.yml release-static must keep make_latest: false; exit 1; }
          echo OK: build.yml release-static make_latest: false

      - name: 29. 检查所有版本号一致（CMakeLists + installer.iss + build.yml .deb + tag）
        run: |
          CMAKE_VER=$(grep 'project(RemiliaPet VERSION' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          ISS_VER=$(grep 'MyAppVersion' installer.iss | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          FAIL=0
          # 1. CMakeLists.txt ↔ installer.iss
          if [ "$CMAKE_VER" != "$ISS_VER" ]; then echo "FAIL: CMakeLists.txt=$CMAKE_VER installer.iss=$ISS_VER"; FAIL=1; fi
          # 2. CMakeLists.txt ↔ build.yml .deb DEBIAN/control Version
          for ver in $(grep '          Version:' .github/workflows/build.yml | sed 's/.*Version: *//'); do
            if [ "$ver" != "$CMAKE_VER" ]; then echo "FAIL: build.yml .deb Version:$ver != $CMAKE_VER"; FAIL=1; fi
          done
          # 3. 与 git tag 一致（仅 tag 触发时校验）
          TAG_VER=$(echo "$GITHUB_REF" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$TAG_VER" ] && [ "$TAG_VER" != "$CMAKE_VER" ]; then
            echo "FAIL: tag v$TAG_VER but project version is $CMAKE_VER"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "OK: all versions match $CMAKE_VER [tag=$TAG_VER]"

      - name: 30. 检查 Unicode 字符码表与源码一致
        run: |
          FAIL=0
          # Extract all fromUtf8 escape strings from all source files
          grep -oPh 'fromUtf8\("\K[^"]*(?="\))' src/*.cpp | sort -u > /tmp/code.txt
          echo "=== fromUtf8 ==="
          while read -r str; do
            [ -z "$str" ] && continue
            if ! grep -qF "$str" 项目约束文件.md; then
              echo "UNREGISTERED fromUtf8: $str"
              FAIL=1
            fi
          done < /tmp/code.txt
          if [ "$FAIL" = "1" ]; then
            echo "请更新 项目约束文件.md §1.15 Unicode 字符码表"
            exit 1
          fi
          echo "OK: Unicode 字符码表与源码一致 (fromUtf8:$(wc -l < /tmp/code.txt))"

      # ============================================================
      # 六、音频 QRC alias 同步检查
      # ============================================================
      - name: 31. 检查 QRC 音频 alias 与 preloadSounds 一致（均为 .wav 无 .mp3）
        run: |
          FAIL=0
          # 1. Extract audio filenames from preloadSounds
          grep '"start\.wav"' src/petwindow.cpp || { echo "FAIL: start.wav not found in preloadSounds"; FAIL=1; }
          # Extract all .wav files in preloadSounds list
          awk '/^void DesktopPet::preloadSounds/,/^}/' src/petwindow.cpp > /tmp/ps.txt
          wav_count=$(grep -oE '"[a-z]+\.wav"' /tmp/ps.txt | sort -u | wc -l)
          echo "preloadSounds .wav files: $wav_count (expect 7)"
          if [ "$wav_count" -ne 7 ]; then
            echo "FAIL: expected 7 .wav files in preloadSounds, found $wav_count"
            FAIL=1
          fi
          # 2. Verify QRC aliases: all audio aliases must be .wav, NOT .mp3
          if grep -q 'alias="audio/[^"]*\.mp3"' resources.qrc; then
            echo "FAIL: resources.qrc contains .mp3 audio aliases — must be .wav"
            grep 'alias="audio/[^"]*\.mp3"' resources.qrc
            FAIL=1
          fi
          # 3. Verify QRC has exactly 7 audio aliases with .wav
          alias_count=$(grep -c 'alias="audio/[^"]*\.wav"' resources.qrc || true)
          echo "QRC .wav aliases: $alias_count (expect 7)"
          if [ "$alias_count" -ne 7 ]; then
            echo "FAIL: expected 7 audio .wav aliases in resources.qrc, found $alias_count"
            FAIL=1
          fi
          # 4. Cross-check: every .wav in preloadSounds has matching QRC alias
          for f in $(grep -oE '"[a-z]+\.wav"' /tmp/ps.txt | tr -d '"' | sort -u); do
            if ! grep -q "alias=\"audio/$f\"" resources.qrc; then
              echo "FAIL: preloadSounds uses $f but no matching QRC alias found"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "请同步 resources.qrc alias 与 preloadSounds 中的音频扩展名（必须均为 .wav）"
            exit 1
          fi
          echo "OK: QRC audio aliases match preloadSounds (all .wav)"

      - name: 32. 检查 resolveSoundSource 有 QRC 提取失败的防御性日志
        run: |
          awk '/^QString DesktopPet::resolveSoundSource/,/^}/' src/petwindow.cpp > /tmp/ps.txt
          # Must have qWarning on QRC open failure
          if ! grep -q 'qWarning.*resolveSoundSource.*QRC resource not found' /tmp/ps.txt; then
            echo "FAIL: resolveSoundSource must log qWarning when QRC resource not found"
            exit 1
          fi
          # Must have qWarning on temp file write failure
          if ! grep -q 'qWarning.*resolveSoundSource.*cannot write temp' /tmp/ps.txt; then
            echo "FAIL: resolveSoundSource must log qWarning when temp file write fails"
            exit 1
          fi
          # Must have qWarning when temp file still missing
          if ! grep -q 'qWarning.*resolveSoundSource.*temp file still missing' /tmp/ps.txt; then
            echo "FAIL: resolveSoundSource must log qWarning when temp file still missing"
            exit 1
          fi
          echo "OK: resolveSoundSource has defensive error logging"

      # ============================================================
      # 七、窗口缩放与跟随约束
      # ============================================================
      - name: 33. 检查 setState/applyScale 窗口与内容共用同一钳位尺寸
        run: |
          awk '/^void DesktopPet::setState/,/^}/' src/petwindow.cpp > /tmp/ss.txt
          grep -q 'qMax(140, qMax(20, (int)(orig.width() \* m_scale)))' /tmp/ss.txt || { echo "FAIL: setState must clamp window as qMax(140, qMax(20, native*scale))"; exit 1; }
          grep -q 'm_currentTargetSize = QSize(cw, ch)' /tmp/ss.txt || { echo "FAIL: setState content must share the clamped window size"; exit 1; }
          awk '/^void DesktopPet::applyScale\(\)/,/^}/' src/petwindow.cpp > /tmp/as.txt
          grep -q 'qMax(140, qMax(20, (int)(orig.width() \* m_scale)))' /tmp/as.txt || { echo "FAIL: applyScale must clamp window as qMax(140, qMax(20, native*scale))"; exit 1; }
          grep -q 'm_currentTargetSize = QSize(cw, ch)' /tmp/as.txt || { echo "FAIL: applyScale content must share the clamped window size"; exit 1; }
          echo "OK: setState/applyScale share one clamped window/content size"

      - name: 34. 检查 applyScale 未用 m_maxNativeSize 定窗口
        run: |
          if grep -q 'm_maxNativeSize.width() \* m_scale' /tmp/as.txt; then
            echo "FAIL: applyScale must not size the window by m_maxNativeSize"
            exit 1
          fi
          echo "OK: applyScale uses current state native size"

      - name: 35. 检查图片类侧窗等比缩放（无 200/150 独立钳位）
        run: |
          if grep -q 'qMax(200, (int)(native.width()' src/petwindow.cpp; then
            echo "FAIL: side windows must not clamp width independently at 200"
            exit 1
          fi
          if grep -q 'qMax(150, (int)(sw \* native.height()' src/petwindow.cpp; then
            echo "FAIL: side windows must not clamp height independently at 150"
            exit 1
          fi
          echo "OK: image side windows scale proportionally"

      - name: 36. 检查 setState 尺寸变化时同步 updateSideWindowPositions
        run: |
          if ! grep -q 'updateSideWindowPositions();' /tmp/ss.txt; then
            echo "FAIL: setState must call updateSideWindowPositions when the window is resized"
            exit 1
          fi
          echo "OK: setState syncs side windows on resize"

      - name: 37. 检查抽卡窗口与桌宠窗口等比联动
        run: |
          awk '/^class DrawEffectWindow/,/^};/' src/petwindow.cpp > /tmp/de.txt
          grep -q 'm_sizeRatio' /tmp/de.txt || { echo "FAIL: DrawEffectWindow must record m_sizeRatio"; exit 1; }
          grep -q 'm_pet->width() \* m_sizeRatio' /tmp/de.txt || { echo "FAIL: DrawEffectWindow must size by pet width * m_sizeRatio"; exit 1; }
          echo "OK: DrawEffectWindow scales in proportion to the pet window"

      # ============================================================
      # 八、资源即时应用约束
      # ============================================================
      - name: 38. 检查 applyResourceChanges 为统一重载入口
        run: |
          grep -q '^void DesktopPet::applyResourceChanges()' src/petwindow.cpp || { echo "FAIL: applyResourceChanges() missing"; exit 1; }
          awk '/^void DesktopPet::refreshOverrides/,/^}/' src/petwindow.cpp > /tmp/ro.txt
          if grep -q 'setState\|m_movie' /tmp/ro.txt; then
            echo "FAIL: refreshOverrides must be pure re-scan — GIF rebuild belongs to applyResourceChanges"
            exit 1
          fi
          echo "OK: applyResourceChanges is the unified reload entry"

      - name: 39. 检查 loadOverrides 在 preloadNativeSizes 之前调用
        run: |
          awk '/^DesktopPet::DesktopPet/,/^}/' src/petwindow.cpp > /tmp/ctor.txt
          LO=$(grep -n 'loadOverrides();' /tmp/ctor.txt | head -1 | cut -d: -f1 || true)
          PN=$(grep -n 'preloadNativeSizes();' /tmp/ctor.txt | head -1 | cut -d: -f1 || true)
          if [ -z "$LO" ] || [ -z "$PN" ] || [ "$LO" -ge "$PN" ]; then
            echo "FAIL: loadOverrides() must run before preloadNativeSizes() in the constructor"
            exit 1
          fi
          echo "OK: overrides loaded before native sizes/sounds/initial state"

      - name: 40. 检查 QFileSystemWatcher 与 scheduleResourceReload 存在
        run: |
          grep -q 'QFileSystemWatcher' src/petwindow.cpp || { echo "FAIL: QFileSystemWatcher missing — external file changes must apply immediately"; exit 1; }
          grep -q '^void DesktopPet::scheduleResourceReload()' src/petwindow.cpp || { echo "FAIL: scheduleResourceReload() missing"; exit 1; }
          echo "OK: file watcher + debounced reload present"

      # ============================================================
      # 九、NAS runner 安全护栏
      # ============================================================
      - name: 41. 检查 NAS job 限定官方仓库（fork 拦截）
        run: |
          GUARD=$(grep -c "github.repository == 'kxgx/remilia_pet_qt'" .github/workflows/build.yml || true)
          if [ "$GUARD" -lt 2 ]; then
            echo "FAIL: static/gitee jobs must both be limited to the official repository"
            exit 1
          fi
          echo "OK: NAS jobs limited to official repository"

      - name: 42. 检查 NAS job 安全护栏步骤与 Bypass shell
        run: |
          grep -q 'SECURITY: fork PRs are not allowed' .github/workflows/build.yml || { echo "FAIL: NAS jobs must throw on fork PRs"; exit 1; }
          grep -q 'head.repo.fork' .github/workflows/build.yml || { echo "FAIL: NAS guard must block fork PRs only (same-repo PR allowed)"; exit 1; }
          grep -q 'powershell -ExecutionPolicy Bypass' .github/workflows/build.yml || { echo "FAIL: NAS jobs must use -ExecutionPolicy Bypass shell"; exit 1; }
          echo "OK: NAS jobs guarded against fork PRs + Bypass shell"

      - name: 43. 检查工作流级最小权限（默认只读）
        run: |
          awk '/^permissions:/,/^jobs:/' .github/workflows/build.yml > /tmp/perm.txt
          grep -q 'contents: read' /tmp/perm.txt || { echo "FAIL: workflow-level permissions must be contents: read"; exit 1; }
          if grep -q 'contents: write' /tmp/perm.txt; then
            echo "FAIL: workflow-level permissions must not grant write by default"
            exit 1
          fi
          echo "OK: minimal workflow permissions (default read)"

      - name: 44. 检查 NAS job run 脚本内容全 ASCII
        run: |
          awk '/^  static:/,/^  release:/' .github/workflows/build.yml > /tmp/nas1.txt
          awk '/^  gitee:/{f=1} f' .github/workflows/build.yml > /tmp/nas2.txt
          if cat /tmp/nas1.txt /tmp/nas2.txt | grep -v 'name:' | grep -v '^ *#' | grep -qP '[\x{4e00}-\x{9fff}]'; then
            echo "FAIL: NAS job run scripts must stay ASCII (PS 5.1 ANSI decoding breaks UTF-8 Chinese)"
            exit 1
          fi
          echo "OK: NAS job run scripts stay ASCII"

      # ============================================================
      # 十、滚轮缩放跨平台
      # ============================================================
      - name: 45. 检查 wheelEvent 处理 pixelDelta 且 saveSettings 防抖
        run: |
          awk '/^void DesktopPet::wheelEvent/,/^}/' src/petwindow.cpp > /tmp/wh.txt
          grep -q 'pixelDelta' /tmp/wh.txt || { echo "FAIL: wheelEvent must fall back to pixelDelta (macOS/Linux trackpad momentum has zero angleDelta)"; exit 1; }
          if grep -q 'saveSettings();' /tmp/wh.txt; then
            echo "FAIL: wheelEvent must not call saveSettings per event — use debounced m_scaleSaveTimer"
            exit 1
          fi
          grep -q 'm_scaleSaveTimer->start()' /tmp/wh.txt || { echo "FAIL: wheelEvent must debounce settings save via m_scaleSaveTimer"; exit 1; }
          echo "OK: wheelEvent handles pixelDelta and debounces settings save"

      # ============================================================
      # 十一、位置保存锚点
      # ============================================================
      - name: 46. 检查位置按屏幕比例保存并实时跟随分辨率变化
        run: |
          awk '/^void DesktopPet::saveSettings/,/^}/' src/petwindow.cpp > /tmp/sav.txt
          grep -q 'rightRatio' /tmp/sav.txt || { echo "FAIL: saveSettings must save rightRatio (screen-relative position)"; exit 1; }
          awk '/^void DesktopPet::loadSettings/,/^}/' src/petwindow.cpp > /tmp/lod.txt
          grep -q 'rightRatio' /tmp/lod.txt || { echo "FAIL: loadSettings must restore by rightRatio"; exit 1; }
          grep -q 'availableGeometryChanged' src/petwindow.cpp || { echo "FAIL: must track screen geometry changes in real time"; exit 1; }
          awk '/^void DesktopPet::setupTrayIcon/,/^}/' src/petwindow.cpp > /tmp/tray.txt
          grep -q '重置位置' /tmp/tray.txt || { echo "FAIL: tray menu must offer reset position"; exit 1; }
          echo "OK: screen-relative position + real-time resolution tracking + tray reset"

      # ============================================================
      # 十二、动态资源与键位显示
      # ============================================================
      - name: 47. 检查动态资源数量与键位显示完整性
        run: |
          if grep -q 'bounded(1, 56)' src/petwindow.cpp || grep -q 'bounded(1, 16)' src/petwindow.cpp; then
            echo "FAIL: card/drawing counts must be dynamic via numberedResourceCount"
            exit 1
          fi
          grep -q '^int DesktopPet::numberedResourceCount' src/petwindow.cpp || { echo "FAIL: numberedResourceCount missing"; exit 1; }
          awk '/^void DesktopPet::saveSettings/,/^}/' src/petwindow.cpp | grep -q 'keyDisplayOnTop' || { echo "FAIL: saveSettings must persist keyDisplayOnTop"; exit 1; }
          awk '/^void DesktopPet::setupTrayIcon/,/^}/' src/petwindow.cpp > /tmp/tray.txt
          KTR=$(grep -c 'u952E' /tmp/tray.txt || true)
          if [ "$KTR" -lt 2 ]; then
            echo "FAIL: tray menu must offer key display toggle + top mode toggle"
            exit 1
          fi
          awk '/^void DesktopPet::contextMenuEvent/,/^}/' src/petwindow.cpp > /tmp/cm.txt
          KCM=$(grep -c 'u952E' /tmp/cm.txt || true)
          if [ "$KCM" -lt 2 ]; then
            echo "FAIL: context menu must offer key display toggle + top mode toggle"
            exit 1
          fi
          grep -q 'm_isFinishedReminding ? qMax(14, (int)(26 \* scale)) : qMax(12, (int)(22 \* scale))' src/petwindow.cpp || { echo "FAIL: TimerWindow scaling must refresh m_statusLabel with readable floor"; exit 1; }
          echo "OK: dynamic resource counts + key display toggles + status label scaling"

      # ============================================================
      # 十三、动态编译流程（PR 全平台编译保障）
      # ============================================================
      - name: 48. 检查动态全平台 PR 编译保障
        run: |
          grep -q 'pull_request:' .github/workflows/build.yml || { echo "FAIL: build.yml must trigger on pull_request (compile before merge)"; exit 1; }
          grep -q 'cancel-in-progress' .github/workflows/build.yml || { echo "FAIL: build.yml must cancel superseded runs"; exit 1; }
          awk '/^  static:/,/^    steps:/' .github/workflows/build.yml > /tmp/st.txt
          if grep -q 'refs/tags/' /tmp/st.txt; then
            echo "FAIL: static job must compile on all triggers like dynamic jobs (release stays tag-only)"
            exit 1
          fi
          grep -q 'head.repo.fork' .github/workflows/build.yml || { echo "FAIL: static guard must block fork PRs only"; exit 1; }
          awk '/^  win-x64:/,/^    steps:/' .github/workflows/build.yml > /tmp/dy.txt
          if grep -q 'refs/tags/' /tmp/dy.txt; then
            echo "FAIL: dynamic jobs must compile on PR (no tag gating)"
            exit 1
          fi
          echo "OK: PR-triggered dynamic+static builds + fork-PR guard + tag-only release"

      # ============================================================
      # 十四、发布门禁（防误发布）
      # ============================================================
      - name: 49. 检查发布 job 仅官方仓库 tag 触发（防误发布）
        run: |
          awk '/^  release:/,/^    runs-on:/' .github/workflows/build.yml > /tmp/rl1.txt
          awk '/^  release-static:/,/^    runs-on:/' .github/workflows/build.yml > /tmp/rl2.txt
          for f in /tmp/rl1.txt /tmp/rl2.txt; do
            grep -q "github.repository == 'kxgx/remilia_pet_qt'" $f || { echo "FAIL: release jobs must require the official repository"; exit 1; }
            grep -q 'refs/tags/' $f || { echo "FAIL: release jobs must be tag-only (prevent accidental publish on PR/master push)"; exit 1; }
          done
          echo "OK: release jobs gated by official repository + tag"

      # ============================================================
      # 十五、deskflow 级编译质量
      # ============================================================
      - name: 50. 检查 Werror 编译与 ci-passed 质量门
        run: |
          WER=$(grep -c 'CMAKE_COMPILE_WARNING_AS_ERROR=ON' .github/workflows/build.yml || true)
          if [ "$WER" -lt 5 ]; then
            echo "FAIL: all 5 dynamic jobs must compile with CMAKE_COMPILE_WARNING_AS_ERROR=ON"
            exit 1
          fi
          grep -q '^  ci-passed:' .github/workflows/build.yml || { echo "FAIL: ci-passed gate job missing"; exit 1; }
          grep -q '检查构建是否污染仓库' .github/workflows/build.yml || { echo "FAIL: repo-clean check after build missing"; exit 1; }
          echo "OK: Werror builds + ci-passed gate + repo-clean check"

      # ============================================================
      # 十六、deskflow 级平台矩阵
      # ============================================================
      - name: 51. 检查 deskflow 级平台矩阵
        run: |
          grep -q 'windows-11-arm' .github/workflows/build.yml || { echo "FAIL: windows ARM64 job missing"; exit 1; }
          grep -q 'vmactions/freebsd-vm' .github/workflows/build.yml || { echo "FAIL: freebsd job missing"; exit 1; }
          grep -q 'flatpak/flatpak-github-actions' .github/workflows/build.yml || { echo "FAIL: flatpak job missing"; exit 1; }
          [ -f deploy/linux/org.remiliapet.desktop.yml ] || { echo "FAIL: flatpak manifest missing"; exit 1; }
          LDM=$(awk '/^  linux-distros:/,/^    steps:/' .github/workflows/build.yml | grep -c 'container:' || true)
          if [ "$LDM" -lt 15 ]; then
            echo "FAIL: linux distro matrix must have at least 15 container entries"
            exit 1
          fi
          echo "OK: deskflow-level platform matrix present"

      # ============================================================
      # 十七、代码风格（clang-format）
      # ============================================================
      - name: 52. 检查 clang-format 代码风格
        run: |
          pip install clang-format==20.1.0
          FILES=$(find src \( -name '*.cpp' -o -name '*.h' \) | grep -v miniaudio)
          clang-format --dry-run --Werror $FILES || { echo "FAIL: code not formatted — run clang-format -i src/*.cpp src/*.h (except miniaudio.h)"; exit 1; }
          echo "OK: clang-format style clean"

      - name: 汇总
        run: echo "✅ 全部 52 项约束检查通过"
