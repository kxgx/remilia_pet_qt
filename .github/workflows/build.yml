            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}"
      - name: 编译
        run: cmake --build build --parallel
      - name: 用 macdeployqt 打包 .app
        run: |
          ${{ env.QT_PATH }}/bin/macdeployqt build/蕾米埃尔桌宠_Qt6.app -verbose=1
      - name: 创建 DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg --volname "蕾米埃尔桌宠" --volicon icon.icns \
            --window-pos 200 120 --window-size 500 360 \
            --icon-size 100 --icon "蕾米埃尔桌宠_Qt6.app" 150 150 \
            --hide-extension "蕾米埃尔桌宠_Qt6.app" \
            --app-drop-link 350 150 \
            "dist/RemiliaPet_Qt6-mac-x64.dmg" build/蕾米埃尔桌宠_Qt6.app/
      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-mac-x64
          path: dist/

