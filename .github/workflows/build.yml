          url = https://github.com/kxgx/remilia_pet_qt
          arch = aarch64
          license = MIT
          depend = qt6-base
          depend = qt6-multimedia
          depend = qt6-svg
          depend = qt6-wayland
          depend = gst-plugins-base
          depend = gst-plugins-good
          depend = gst-plugins-bad
          PKGINFO
          cd $PKG && tar -c --zstd -f ../RemiliaPet_Qt6-linux-arm64.pkg.tar.zst .
          cd .. && ls -la *.pkg.tar.zst
      - name: 上传 Arch 包
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-linux-arm64-arch
          path: RemiliaPet_Qt6-linux-arm64.pkg.tar.zst

  # ===================================================================
  # Release
  # ===================================================================
  release:
    name: 发布
    needs: [win-x64, mac-x64, mac-arm64, linux-x64, linux-arm64, linux-arch, linux-arch-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RemiliaPet_Qt6-**
          merge-multiple: true
      - name: 列出构件
        run: ls -la
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RemiliaPet_Qt6-*
          draft: false
          prerelease: false
          make_latest: true
