          Terminal=false
          EOF
          python3 -c "from PIL import Image; img = Image.open('icon.png'); img.resize((256,256), Image.LANCZOS).save('AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png')"
          ./linuxdeploy-aarch64.AppImage --appdir AppDir --executable build/蕾米埃尔桌宠_Qt6 \
            --desktop-file AppDir/usr/share/applications/remilia-pet.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png \
            --plugin qt
          mkdir -p AppDir/usr/plugins/platforms
          cp /usr/lib/aarch64-linux-gnu/qt6/plugins/platforms/libqwayland-*.so AppDir/usr/plugins/platforms/ 2>/dev/null; true
          cp -r /usr/lib/aarch64-linux-gnu/qt6/plugins/wayland-shell-integration AppDir/usr/plugins/ 2>/dev/null; true
          cp -r /usr/lib/aarch64-linux-gnu/qt6/plugins/wayland-graphics-integration-client AppDir/usr/plugins/ 2>/dev/null; true
          cp -r /usr/lib/aarch64-linux-gnu/qt6/plugins/wayland-decoration-client AppDir/usr/plugins/ 2>/dev/null; true
          cp /usr/lib/aarch64-linux-gnu/libQt6WaylandClient.so* AppDir/usr/lib/ 2>/dev/null; true
          cp /usr/lib/aarch64-linux-gnu/libQt6WaylandEglClientHwIntegration.so* AppDir/usr/lib/ 2>/dev/null; true
          cat > AppDir/remilia-pet << 'LAUNCHER'
          #!/bin/bash
          export LD_LIBRARY_PATH="/opt/remilia-pet/lib:/opt/remilia-pet/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="/opt/remilia-pet/usr/plugins"
          export QT_QPA_PLATFORM=xcb
          exec /opt/remilia-pet/usr/bin/蕾米埃尔桌宠_Qt6 "$@"
          LAUNCHER
          chmod +x AppDir/remilia-pet
          # Build .deb
          DEB=deb-root
          mkdir -p $DEB/DEBIAN $DEB/opt/remilia-pet $DEB/usr/bin
          mkdir -p $DEB/usr/share/applications $DEB/usr/share/icons/hicolor/256x256/apps
          mkdir -p $DEB/etc/xdg/autostart
          cp -a AppDir/* $DEB/opt/remilia-pet/
          ln -sf /opt/remilia-pet/remilia-pet $DEB/usr/bin/remilia-pet
          cp AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png $DEB/usr/share/icons/hicolor/256x256/apps/
          cat > $DEB/usr/share/applications/remilia-pet.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=蕾米埃尔桌宠
          Comment=桌面宠物
          Exec=/opt/remilia-pet/remilia-pet
          Icon=remilia-pet
          Categories=Utility;
          Terminal=false
          DESKTOP
          cat > $DEB/etc/xdg/autostart/remilia-pet.desktop << 'AUTOSTART'
          [Desktop Entry]
          Type=Application
          Name=蕾米埃尔桌宠
          Exec=/opt/remilia-pet/remilia-pet
          Icon=remilia-pet
          X-GNOME-Autostart-enabled=true
          AUTOSTART
          # systemd user service (modern distros)
          mkdir -p $DEB/usr/lib/systemd/user
          cat > $DEB/usr/lib/systemd/user/remilia-pet.service << 'SYSTEMD'
          [Unit]
          Description=蕾米埃尔桌宠 (Remilia Pet)
          After=graphical-session.target
          PartOf=graphical-session.target

          [Service]
          ExecStart=/opt/remilia-pet/remilia-pet
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          SYSTEMD
          cat > $DEB/DEBIAN/control << 'CONTROL'
          Package: remilia-pet
          Version: 1.0.8
          Section: utils
          Priority: optional
          Architecture: arm64
          Depends: libc6, libgl1, libpulse0, libasound2, libglib2.0-bin
          Maintainer: kxgx
          Description: 蕾米埃尔桌宠 (Remilia Pet) - 桌面宠物应用
          CONTROL
          cat > $DEB/DEBIAN/postinst << 'POSTINST'
          #!/bin/bash
          set -e
          echo "✅ 蕾米埃尔桌宠 已安装"
          echo "   终端运行: remilia-pet"
          # 检测发行版版本，选择自启方式（现代桌面→XDG，老旧/无桌面→systemd）
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            DID="${ID}"; DVER="${VERSION_ID}"
          else
            DID="unknown"; DVER="0"
          fi
          USE_XDG=0
          if [ -d /etc/xdg/autostart ]; then
            case "$DID" in
              ubuntu)   [ "${DVER%%.*}" -ge 18 ] && USE_XDG=1 ;;
              debian)   [ "${DVER%%.*}" -ge 10 ] && USE_XDG=1 ;;
              fedora)   [ "${DVER%%.*}" -ge 30 ] && USE_XDG=1 ;;
              centos|rhel) [ "${DVER%%.*}" -ge 8 ] && USE_XDG=1 ;;
              arch|manjaro) USE_XDG=1 ;;
              opensuse*) [ "${DVER%%.*}" -ge 15 ] && USE_XDG=1 ;;
              *)        USE_XDG=1 ;;
            esac
          fi
          if [ "$USE_XDG" = "1" ]; then
            echo "   自启方式: XDG autostart (取消: sudo rm /etc/xdg/autostart/remilia-pet.desktop)"
          elif command -v systemctl &>/dev/null && systemctl --user &>/dev/null 2>&1; then
            systemctl --global enable remilia-pet.service 2>/dev/null && \
              echo "   自启方式: systemd user service (取消: sudo systemctl --global disable remilia-pet.service)" || \
              echo "   ⚠ 自启配置失败，请手动设置"
          else
            echo "   ⚠ 无法自动配置自启，请手动设置"
          fi
          POSTINST
          chmod 755 $DEB/DEBIAN/postinst
          dpkg-deb --build $DEB RemiliaPet_Qt6-linux-arm64.deb
          # Convert to .rpm
          sudo apt-get install -y alien
          sudo alien -r --scripts RemiliaPet_Qt6-linux-arm64.deb
          mv remilia-pet-*.rpm RemiliaPet_Qt6-linux-arm64.rpm 2>/dev/null || true
          ls -la *.rpm 2>/dev/null || true
          # Build portable tar.gz
          tar -czf RemiliaPet_Qt6-linux-arm64.tar.gz -C AppDir .
          ls -la RemiliaPet_Qt6-linux-arm64.*
      - name: 上传 .deb
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-linux-arm64-deb
          path: RemiliaPet_Qt6-linux-arm64.deb
      - name: 上传 .rpm
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-linux-arm64-rpm
          path: RemiliaPet_Qt6-linux-arm64.rpm
      - name: 上传 tar.gz
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-linux-arm64-targz
          path: RemiliaPet_Qt6-linux-arm64.tar.gz

  # ===================================================================
  # Windows x64 静态版 (NAS runner)
  # ===================================================================
  static:
    name: Windows x64 静态版
    needs: [checks, deepsec]
    # 编译触发与动态 job 一致（push master / PR / tag / dispatch），仅 fork PR 被护栏拦截；
    # 发布仍由 release-static job 的 tag 门禁控制，本 job 只编译+上传构件
    if: github.repository == 'kxgx/remilia_pet_qt'
    runs-on: [self-hosted, Windows, X64, nas]
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        # NAS runner 的 PowerShell ExecutionPolicy 可能为 Restricted，导致步骤脚本无法加载；
        # 统一用 Bypass 执行（根治：在 NAS 上以管理员运行
        #   Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine）
        shell: 'powershell -ExecutionPolicy Bypass -command ". ''{0}''"'
    steps:
      - name: 安全护栏（禁止 fork PR 在本 runner 执行）
        run: |
          # NOTE: script content must stay ASCII — Windows PowerShell 5.1 reads .ps1 as ANSI
          if ("$env:GITHUB_EVENT_NAME" -eq 'pull_request') {
            $ev = Get-Content $env:GITHUB_EVENT_PATH | ConvertFrom-Json
            if ($ev.pull_request.head.repo.fork) { throw "SECURITY: fork PRs are not allowed on the NAS runner" }
          }
      - uses: actions/checkout@v5

      - name: 添加 Git usr/bin 到 PATH
        run: echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 清理源码（保留 dist-static）
        run: |
          # runner 服务账号（NETWORK SERVICE）与工作区属主（xg\xgxv）不一致时 git 报 dubious ownership
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          git clean -xdf -e dist-static

      - name: 配置 CMake
        run: |
          New-Item -ItemType Directory -Force -Path C:/remilia_build
          cmake -B C:/remilia_build/static -S . -G "Visual Studio 17 2022" -T version=14.44 `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: 编译
        run: cmake --build C:/remilia_build/static --config Release --parallel

      - name: 准备 dist-static 目录
        run: New-Item -ItemType Directory -Force -Path dist-static

      - name: 复制便携版 exe
        run: Copy-Item C:/remilia_build/static/Release/*.exe dist-static/

      - name: 编译安装器 (Inno Setup)
        run: |
          $iscc = $null
          foreach ($p in @("C:\Program Files (x86)\Inno Setup 6\iscc.exe", "$env:LOCALAPPDATA\InnoSetup\iscc.exe")) {
            if (Test-Path $p) { $iscc = $p; break }
          }
          if (-not $iscc) {
            Write-Host "Fetching latest Inno Setup from GitHub..."
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/jrsoftware/issrc/releases/latest"
            $asset = $release.assets | Where-Object { $_.name -match '^innosetup-.*\.exe$' } | Select-Object -First 1
            if (-not $asset) { throw "No .exe asset found" }
            Write-Host "Downloading $($asset.name) ($($release.tag_name))..."
            $tmp = "$env:TEMP\innosetup-installer.exe"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tmp
            Write-Host "Installing to user scope (no admin)..."
            # /CURRENTUSER 必须：否则安装器尝试写 HKLM 需管理员权限，/VERYSILENT 下静默失败
            & $tmp /VERYSILENT /CURRENTUSER /SUPPRESSMSGBOXES /DIR="$env:LOCALAPPDATA\InnoSetup" /NOICONS /NORESTART | Out-Null
            $iscc = "$env:LOCALAPPDATA\InnoSetup\iscc.exe"
            if (-not (Test-Path $iscc)) {
              Write-Host "iscc.exe still missing, listing LOCALAPPDATA\InnoSetup:"
              Get-ChildItem -Recurse "$env:LOCALAPPDATA\InnoSetup" -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
              throw "Inno Setup silent install failed (iscc.exe not found)"
            }
          }
          & $iscc /DBuildDir="C:\remilia_build\static\Release" installer.iss
          $setupExe = Get-ChildItem -Path Output -Filter "*Setup*.exe" | Select-Object -First 1
          Copy-Item $setupExe.FullName dist-static/RemiliaPet_Qt6-windows-x64-static-Setup.exe
          Write-Host "Installer: $($setupExe.Name) -> dist-static/RemiliaPet_Qt6-windows-x64-static-Setup.exe"

      - name: 打包 zip
        run: Compress-Archive -Path dist-static/* -DestinationPath dist-static/RemiliaPet_Qt6-win-x64-static.zip

      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-win-x64-static
          path: dist-static/

  # ===================================================================
  # Release - 动态版
  # ===================================================================
  release:
    name: 发布动态版
    needs: [win-x64, windows-arm64, mac-x64, mac-arm64, linux-x64, linux-arm64]
    # 发布门禁：仅官方仓库的 tag 触发，PR/master push 一律不发布（防误发布）
    if: github.repository == 'kxgx/remilia_pet_qt' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: RemiliaPet_Qt6-**
          merge-multiple: true
      - name: 列出构件
        run: ls -la
      - name: 创建 GitHub Release (动态版)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RemiliaPet_Qt6-*
          draft: false
          prerelease: false
          make_latest: true

  # ===================================================================
  # Release - 静态版
  # ===================================================================
  release-static:
    name: 发布静态版
    needs: [static]
    # 发布门禁：仅官方仓库的 tag 触发（防误发布）
    if: github.repository == 'kxgx/remilia_pet_qt' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: RemiliaPet_Qt6-win-x64-static
      - name: 解压并重命名
        run: |
          unzip -q RemiliaPet_Qt6-win-x64-static.zip -d release/
          PORTABLE=$(find release/ -name "*.exe" ! -name "*Setup*" | head -1)
          echo "Found portable: $PORTABLE"
          mv "$PORTABLE" RemiliaPet_Qt6-windows-x64-static.exe
          SETUP=$(find release/ -name "*Setup*.exe" | head -1)
          echo "Found setup: $SETUP"
          cp "$SETUP" RemiliaPet_Qt6-windows-x64-static-Setup.exe
      - name: 创建 GitHub Release (静态版)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RemiliaPet_Qt6-win-x64-static.zip
            RemiliaPet_Qt6-windows-x64-static.exe
            RemiliaPet_Qt6-windows-x64-static-Setup.exe
          draft: false
          prerelease: false
          make_latest: false

  # ===================================================================
  # Gitee Release (统一：动态 + 静态，单 job 无竞争)
  # ===================================================================
  gitee:
    name: 发布到 Gitee
    needs: [win-x64, mac-x64, mac-arm64, linux-x64, linux-arm64, static]
    if: always() && startsWith(github.ref, 'refs/tags/') && github.repository == 'kxgx/remilia_pet_qt'
    runs-on: [self-hosted, Windows, X64, nas]
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        # 同 static job：NAS runner 的 ExecutionPolicy 为 Restricted，需 Bypass
        shell: 'powershell -ExecutionPolicy Bypass -command ". ''{0}''"'
    steps:
      - name: 安全护栏（禁止 PR / 非 tag 触发在本 runner 执行）
        run: |
          # NOTE: script content must stay ASCII — Windows PowerShell 5.1 reads .ps1 as ANSI
          if ("$env:GITHUB_EVENT_NAME" -eq 'pull_request') { throw "SECURITY: pull_request events are not allowed on the NAS runner" }
          if ("$env:GITHUB_REF" -notlike 'refs/tags/v*' -and "$env:GITHUB_EVENT_NAME" -ne 'workflow_dispatch') { throw "SECURITY: only tag pushes or manual dispatch are allowed on the NAS runner" }
      - uses: actions/download-artifact@v7
        with:
          pattern: RemiliaPet_Qt6-**
          merge-multiple: true
      - name: 解压静态版并重命名
        run: |
          Expand-Archive -Path RemiliaPet_Qt6-win-x64-static.zip -DestinationPath release/
          $cn = Get-ChildItem release/*.exe | Where-Object { $_.Name -notlike '*Setup*' }
          if ($cn) {
            Rename-Item $cn.FullName "RemiliaPet_Qt6-windows-x64-static.exe"
            Write-Host "Renamed $($cn.Name) -> RemiliaPet_Qt6-windows-x64-static.exe"
          }
          Get-ChildItem release/
      - name: 发布到 Gitee Release
        run: |
          $TAG = $env:GITHUB_REF -replace '^refs/tags/', ''
          $VERSION = $TAG -replace '^v', ''
          $repo = "https://gitee.com/api/v5/repos/xingguangk/remilia_pet_qt"
          $headers = @{Authorization="token ${{ secrets.GITEE_TOKEN }}"}

          try {
            $gh = Invoke-RestMethod -Uri "https://api.github.com/repos/kxgx/remilia_pet_qt/releases/tags/$TAG" -Headers @{Authorization="token ${{ secrets.GITHUB_TOKEN }}"}
            $releaseBody = $gh.body
            Write-Host "Got GitHub release body ($($releaseBody.Length) chars)"
          } catch {
            Write-Host "GitHub release not ready, using fallback"
            $releaseBody = "All platforms"
          }

          # Delete old release + create new (single job, no race condition)
          try {
            $old = Invoke-RestMethod -Uri "$repo/releases/tags/$TAG" -Headers $headers
            Write-Host "Deleting old release $($old.id)..."
            Invoke-RestMethod -Uri "$repo/releases/$($old.id)" -Method Delete -Headers $headers
          } catch {
            Write-Host "No old release to delete"
          }
          $body = @{tag_name=$TAG; name="v$VERSION"; body=$releaseBody; target_commitish="master"} | ConvertTo-Json -Compress
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$env:TEMP\gitee_body.json", $body, $utf8NoBom)
          $RESP = & curl.exe -s -X POST "$repo/releases" -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" -H "Content-Type: application/json; charset=utf-8" --data-binary "@$env:TEMP\gitee_body.json"
          Remove-Item "$env:TEMP\gitee_body.json"
          $RELEASE_ID = ($RESP | ConvertFrom-Json).id
          Write-Host "Created release: $RELEASE_ID"

          # Upload dynamic files
          Get-ChildItem RemiliaPet_Qt6-* -Exclude *static* | ForEach-Object {
            $name = $_.Name
            Write-Host "Uploading $name..."
            for ($r = 0; $r -lt 3; $r++) {
              try {
                & curl.exe -s -X POST "$repo/releases/$RELEASE_ID/attach_files" -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" -F "file=@$($_.FullName);filename=$name"
                Write-Host "  OK"
                break
              } catch {
                if ($r -lt 2) { Write-Host "  Retry $($r+1)/3 after 15s..."; Start-Sleep 15 }
                else { Write-Host "  FAILED"; throw }
              }
            }
          }

          # Upload static files
          Get-ChildItem release/*.exe, release/*.zip | ForEach-Object {
            $name = $_.Name
            Write-Host "Uploading $name..."
            for ($r = 0; $r -lt 3; $r++) {
              try {
                & curl.exe -s -X POST "$repo/releases/$RELEASE_ID/attach_files" -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" -F "file=@$($_.FullName);filename=$name"
                Write-Host "  OK"
                break
              } catch {
                if ($r -lt 2) { Write-Host "  Retry $($r+1)/3 after 15s..."; Start-Sleep 15 }
                else { Write-Host "  FAILED"; throw }
              }
            }
          }
          Write-Host "Done: Gitee release complete"

  # ===================================================================
  # Windows ARM64（同 deskflow）
  # ===================================================================
  windows-arm64:
    name: Windows ARM64
    needs: [checks, deepsec]
    runs-on: windows-11-arm
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: 通过 aqtinstall 安装 Qt6
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.2 win64_msvc2022_arm64 -m qtmultimedia -O C:/Qt
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.8.2/msvc2022_arm64" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: 编译
        run: cmake --build build --config Release --parallel
      - name: 部署 Qt 动态库
        run: |
          C:/Qt/6.8.2/msvc2022_arm64/bin/windeployqt build/Release/蕾米埃尔桌宠_Qt6.exe --release --no-translations
      - name: 打包 zip
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build/Release/* -DestinationPath dist/RemiliaPet_Qt6-win-arm64.zip
      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-win-arm64
          path: dist/

  # ===================================================================
  # Linux 发行版编译检查矩阵（同 deskflow：容器内编译，仅检查不打包）
  # ===================================================================
  linux-distros:
    name: linux-${{ matrix.distro }}-${{ matrix.arch }}
    needs: [checks, deepsec]
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 25
    if: github.repository == 'kxgx/remilia_pet_qt'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian, container: 'debian:stable-slim', like: debian, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: debian, container: 'debian:stable-slim', like: debian, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { distro: debian-testing, container: 'debian:testing-slim', like: debian, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: debian-testing, container: 'debian:testing-slim', like: debian, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { distro: fedora, container: 'fedora:latest', like: fedora, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: fedora, container: 'fedora:latest', like: fedora, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { distro: fedora-rawhide, container: 'fedora:rawhide', like: fedora, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: fedora-rawhide, container: 'fedora:rawhide', like: fedora, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { distro: opensuse, container: 'opensuse/tumbleweed:latest', like: suse, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: opensuse, container: 'opensuse/tumbleweed:latest', like: suse, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { distro: archlinux, container: 'archlinux:latest', like: arch, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: ubuntu, container: 'ubuntu:latest', like: debian, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: ubuntu, container: 'ubuntu:latest', like: debian, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { distro: ubuntu-devel, container: 'ubuntu:devel', like: debian, arch: x86_64, runs-on: ubuntu-latest }
          - { distro: ubuntu-devel, container: 'ubuntu:devel', like: debian, arch: arm64, runs-on: ubuntu-24.04-arm }
    steps:
      - name: 安装 git（容器无 git，先装才能 checkout）
        run: |
          if [ "${{ matrix.like }}" = "debian" ]; then
            apt-get update -qq && apt-get install -y -qq git
          elif [ "${{ matrix.like }}" = "fedora" ]; then
            dnf install -y git
          elif [ "${{ matrix.like }}" = "suse" ]; then
            zypper refresh && zypper install -y --force-resolution git
          elif [ "${{ matrix.like }}" = "arch" ]; then
            pacman -Syu --noconfirm git
          fi
      - uses: actions/checkout@v5
      - name: 安装编译依赖
        run: |
          if [ "${{ matrix.like }}" = "debian" ]; then
            apt-get install -y -qq cmake build-essential ninja-build qt6-base-dev libx11-dev
          elif [ "${{ matrix.like }}" = "fedora" ]; then
            dnf install -y cmake make ninja-build gcc-c++ qt6-qtbase-devel libX11-devel
          elif [ "${{ matrix.like }}" = "suse" ]; then
            zypper install -y --force-resolution cmake make ninja gcc-c++ qt6-base-devel libX11-devel
          elif [ "${{ matrix.like }}" = "arch" ]; then
            pacman -Syu --noconfirm base-devel cmake ninja qt6-base libx11
          fi
      - name: 配置 CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: 编译
        run: cmake --build build --parallel

  # ===================================================================
  # FreeBSD（同 deskflow：VM 内编译检查）
  # ===================================================================
  freebsd:
    name: freebsd
    needs: [checks, deepsec]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.repository == 'kxgx/remilia_pet_qt'
    steps:
      - uses: actions/checkout@v5
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: "14.4"
          run: |
            pkg install -y cmake ninja qt6-base libX11
            cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
            cmake --build build --parallel

  # ===================================================================
  # Flatpak（同 deskflow）
  # ===================================================================
  flatpak:
    name: flatpak-${{ matrix.arch }}
    needs: [checks, deepsec]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    if: github.repository == 'kxgx/remilia_pet_qt'
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v5
      - run: git config --global protocol.file.allow always
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: remilia-pet-linux-${{ matrix.arch }}.flatpak
          manifest-path: deploy/linux/org.remiliapet.desktop.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-1
          arch: ${{ matrix.arch }}
          upload-artifact: false
      - name: 上传构件
        uses: actions/upload-artifact@v6
        with:
          name: remilia-pet-flatpak-${{ matrix.arch }}
          path: remilia-pet-linux-*.flatpak

  # ===================================================================
  # 质量门（同 deskflow ci-passed）：所有平台编译成功才算通过，
  # 供分支保护规则挂载，避免逐 job 罗列。
  # ===================================================================
  ci-passed:
    name: 全平台编译通过
    needs: [win-x64, mac-x64, mac-arm64, linux-x64, linux-arm64, windows-arm64, linux-distros, freebsd, flatpak]
    if: always() && github.repository == 'kxgx/remilia_pet_qt'
    runs-on: ubuntu-latest
    steps:
      - name: 校验所有平台结果
        run: |
          for r in ${{ needs.win-x64.result }} ${{ needs.mac-x64.result }} ${{ needs.mac-arm64.result }} ${{ needs.linux-x64.result }} ${{ needs.linux-arm64.result }} ${{ needs.windows-arm64.result }} ${{ needs.linux-distros.result }} ${{ needs.freebsd.result }} ${{ needs.flatpak.result }}; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "FAIL: one or more platform builds failed"
              exit 1
            fi
          done
          echo "OK: all platform builds passed"
