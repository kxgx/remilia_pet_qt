  # ===================================================================
  # Linux x86_64
  # ===================================================================
  linux-x64:
    name: Linux x64
    needs: [checks, deepsec]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: 安装依赖 + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libpulse-dev libasound2-dev libx11-dev \
            qt6-base-dev qt6-multimedia-dev qt6-wayland libqt6svg6-dev \
            python3-pil
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: 编译
        run: cmake --build build --parallel
      - name: 检查构建是否污染仓库
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: build modified tracked files"
            git status --porcelain
            exit 1
          fi
          echo "OK: working tree clean after build"
      - name: 打包 .deb + .rpm + tar.gz
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/remilia-pet.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Remilia Pet
          Comment=Remilia Pet Qt6
          Exec=蕾米埃尔桌宠_Qt6
          Icon=remilia-pet
          Categories=Utility;
          Terminal=false
          EOF
          python3 -c "from PIL import Image; img = Image.open('icon.png'); img.resize((256,256), Image.LANCZOS).save('AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png')"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/蕾米埃尔桌宠_Qt6 \
            --desktop-file AppDir/usr/share/applications/remilia-pet.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png \
            --plugin qt
          mkdir -p AppDir/usr/plugins/platforms
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqwayland-*.so AppDir/usr/plugins/platforms/ 2>/dev/null; true
          cp -r /usr/lib/x86_64-linux-gnu/qt6/plugins/wayland-shell-integration AppDir/usr/plugins/ 2>/dev/null; true
          cp -r /usr/lib/x86_64-linux-gnu/qt6/plugins/wayland-graphics-integration-client AppDir/usr/plugins/ 2>/dev/null; true
          cp -r /usr/lib/x86_64-linux-gnu/qt6/plugins/wayland-decoration-client AppDir/usr/plugins/ 2>/dev/null; true
          cp /usr/lib/x86_64-linux-gnu/libQt6WaylandClient.so* AppDir/usr/lib/ 2>/dev/null; true
          cp /usr/lib/x86_64-linux-gnu/libQt6WaylandEglClientHwIntegration.so* AppDir/usr/lib/ 2>/dev/null; true
          cat > AppDir/remilia-pet << 'LAUNCHER'
          #!/bin/bash
          export LD_LIBRARY_PATH="/opt/remilia-pet/lib:/opt/remilia-pet/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="/opt/remilia-pet/usr/plugins"
          export QT_QPA_PLATFORM=xcb
          exec /opt/remilia-pet/usr/bin/蕾米埃尔桌宠_Qt6 "$@"
          LAUNCHER
          chmod +x AppDir/remilia-pet
          # Build .deb
          DEB=deb-root
          mkdir -p $DEB/DEBIAN $DEB/opt/remilia-pet $DEB/usr/bin
          mkdir -p $DEB/usr/share/applications $DEB/usr/share/icons/hicolor/256x256/apps
          mkdir -p $DEB/etc/xdg/autostart
          cp -a AppDir/* $DEB/opt/remilia-pet/
          ln -sf /opt/remilia-pet/remilia-pet $DEB/usr/bin/remilia-pet
          cp AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png $DEB/usr/share/icons/hicolor/256x256/apps/
          cat > $DEB/usr/share/applications/remilia-pet.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=蕾米埃尔桌宠
          Comment=桌面宠物
          Exec=/opt/remilia-pet/remilia-pet
          Icon=remilia-pet
          Categories=Utility;
          Terminal=false
          DESKTOP
          cat > $DEB/etc/xdg/autostart/remilia-pet.desktop << 'AUTOSTART'
          [Desktop Entry]
          Type=Application
          Name=蕾米埃尔桌宠
          Exec=/opt/remilia-pet/remilia-pet
          Icon=remilia-pet
          X-GNOME-Autostart-enabled=true
          AUTOSTART
          # systemd user service (modern distros)
          mkdir -p $DEB/usr/lib/systemd/user
          cat > $DEB/usr/lib/systemd/user/remilia-pet.service << 'SYSTEMD'
          [Unit]
          Description=蕾米埃尔桌宠 (Remilia Pet)
          After=graphical-session.target
          PartOf=graphical-session.target

          [Service]
          ExecStart=/opt/remilia-pet/remilia-pet
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          SYSTEMD
          cat > $DEB/DEBIAN/control << 'CONTROL'
          Package: remilia-pet
          Version: 1.0.8
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgl1, libpulse0, libasound2, libglib2.0-bin
          Maintainer: kxgx
          Description: 蕾米埃尔桌宠 (Remilia Pet) - 桌面宠物应用
          CONTROL
          cat > $DEB/DEBIAN/postinst << 'POSTINST'
          #!/bin/bash
          set -e
          echo "✅ 蕾米埃尔桌宠 已安装"
          echo "   终端运行: remilia-pet"
          # 检测发行版版本，选择自启方式（现代桌面→XDG，老旧/无桌面→systemd）
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            DID="${ID}"; DVER="${VERSION_ID}"
          else
            DID="unknown"; DVER="0"
          fi
          USE_XDG=0
          if [ -d /etc/xdg/autostart ]; then
            case "$DID" in
              ubuntu)   [ "${DVER%%.*}" -ge 18 ] && USE_XDG=1 ;;
              debian)   [ "${DVER%%.*}" -ge 10 ] && USE_XDG=1 ;;
              fedora)   [ "${DVER%%.*}" -ge 30 ] && USE_XDG=1 ;;
              centos|rhel) [ "${DVER%%.*}" -ge 8 ] && USE_XDG=1 ;;
              arch|manjaro) USE_XDG=1 ;;
              opensuse*) [ "${DVER%%.*}" -ge 15 ] && USE_XDG=1 ;;
              *)        USE_XDG=1 ;;
            esac
          fi
          if [ "$USE_XDG" = "1" ]; then
            echo "   自启方式: XDG autostart (取消: sudo rm /etc/xdg/autostart/remilia-pet.desktop)"
          elif command -v systemctl &>/dev/null && systemctl --user &>/dev/null 2>&1; then
            systemctl --global enable remilia-pet.service 2>/dev/null && \
              echo "   自启方式: systemd user service (取消: sudo systemctl --global disable remilia-pet.service)" || \
              echo "   ⚠ 自启配置失败，请手动设置"
          else
            echo "   ⚠ 无法自动配置自启，请手动设置"
          fi
          POSTINST
          chmod 755 $DEB/DEBIAN/postinst
          dpkg-deb --build $DEB RemiliaPet_Qt6-linux-x64.deb
          # Convert to .rpm
          sudo apt-get install -y alien
          sudo alien -r --scripts RemiliaPet_Qt6-linux-x64.deb
          mv remilia-pet-*.x86_64.rpm RemiliaPet_Qt6-linux-x64.rpm 2>/dev/null || true
          ls -la *.rpm 2>/dev/null || true
          # Build portable tar.gz
          tar -czf RemiliaPet_Qt6-linux-x64.tar.gz -C AppDir .
          ls -la RemiliaPet_Qt6-linux-x64.*
      - name: 上传 .deb
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-linux-x64-deb
          path: RemiliaPet_Qt6-linux-x64.deb
      - name: 上传 .rpm
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-linux-x64-rpm
          path: RemiliaPet_Qt6-linux-x64.rpm
      - name: 上传 tar.gz
        uses: actions/upload-artifact@v6
        with:
          name: RemiliaPet_Qt6-linux-x64-targz
          path: RemiliaPet_Qt6-linux-x64.tar.gz

