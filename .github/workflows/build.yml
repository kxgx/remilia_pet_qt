name: Cross-Platform Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Windows x64 — aqtinstall pre-built Qt + windeployqt (~3 min)
  # ═══════════════════════════════════════════════════════════════════
  win-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.9.2 win64_msvc2022_64 -m qtmultimedia -O C:/Qt

      - name: Configure
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.9.2/msvc2022_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: windeployqt
        run: |
          C:/Qt/6.9.2/msvc2022_64/bin/windeployqt build/Release/RemiliaPet.exe --release --no-translations

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet-win-x64
          path: build/Release/

  # ═══════════════════════════════════════════════════════════════════
  # Windows ARM64 — native ARM64 Qt 6.9.0
  # ═══════════════════════════════════════════════════════════════════
  win-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.9.0 win64_msvc2022_64 -O C:/Qt
          aqt install-qt windows desktop 6.9.0 win64_msvc2022_arm64 -m qtmultimedia -O C:/Qt

      - name: Configure
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A ARM64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.9.0/msvc2022_arm64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: windeployqt
        run: |
          C:/Qt/6.9.0/msvc2022_arm64/bin/windeployqt build/Release/RemiliaPet.exe --release --no-translations

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet-win-arm64
          path: build/Release/

  # ═══════════════════════════════════════════════════════════════════
  # macOS ARM64 — Homebrew Qt (avoids vcpkg libb2 compile failure)
  # ═══════════════════════════════════════════════════════════════════
  mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 via Homebrew
        run: |
          brew install ninja qt6
          echo "QT_PATH=$(brew --prefix qt6)" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Package .app with macdeployqt
        run: |
          ${{ env.QT_PATH }}/bin/macdeployqt build/RemiliaPet.app -verbose=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet-mac-arm64
          path: build/RemiliaPet.app

  # ═══════════════════════════════════════════════════════════════════
  # Linux x64 — apt Qt6 (~3 min)
  # ═══════════════════════════════════════════════════════════════════
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libpulse-dev libasound2-dev \
            qt6-base-dev qt6-multimedia-dev libqt6svg6-dev

      - name: Configure
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet-linux-x64
          path: build/RemiliaPet

  # ═══════════════════════════════════════════════════════════════════
  # Linux ARM64 — apt Qt6 (avoids vcpkg arm64-linux triplet issues)
  # ═══════════════════════════════════════════════════════════════════
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libpulse-dev libasound2-dev \
            qt6-base-dev qt6-multimedia-dev libqt6svg6-dev

      - name: Configure
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet-linux-arm64
          path: build/RemiliaPet

  # ═══════════════════════════════════════════════════════════════════
  # Create GitHub Release on tag push
  # ═══════════════════════════════════════════════════════════════════
  release:
    needs: [win-x64, win-arm64, mac-arm64, linux-x64, linux-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RemiliaPet-*
          merge-multiple: true

      - name: Package
        run: |
          for dir in RemiliaPet-*; do
            zip -r "${dir}.zip" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: RemiliaPet-*.zip
          draft: true
