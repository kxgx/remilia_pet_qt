name: 跨平台构建（动态版）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ===================================================================
  # Windows x64
  # ===================================================================
  win-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 通过 aqtinstall 安装 Qt6
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 -m qtmultimedia -O C:/Qt
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.8.2/msvc2022_64"
      - name: 编译
        run: cmake --build build --config Release --parallel
      - name: 部署 Qt 动态库
        run: |
          C:/Qt/6.8.2/msvc2022_64/bin/windeployqt build/Release/蕾米埃尔桌宠_Qt6.exe --release --no-translations
      - name: 打包 zip
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build/Release/* -DestinationPath dist/RemiliaPet_Qt6-win-x64.zip
      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-win-x64
          path: dist/

  # ===================================================================
  # macOS x64 (Intel)
  # ===================================================================
  mac-x64:
    name: macOS x64 (Intel)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: 通过 Homebrew 安装 Qt6
        run: |
          brew install ninja qt6
          echo "QT_PATH=$(brew --prefix qt6)" >> $GITHUB_ENV
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}"
      - name: 编译
        run: cmake --build build --parallel
      - name: 用 macdeployqt 打包 .app
        run: |
          ${{ env.QT_PATH }}/bin/macdeployqt build/蕾米埃尔桌宠_Qt6.app -verbose=1
      - name: 创建 DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg --volname "蕾米埃尔桌宠" --volicon icon.icns \
            --window-pos 200 120 --window-size 500 360 \
            --icon-size 100 --icon "蕾米埃尔桌宠_Qt6.app" 150 150 \
            --hide-extension "蕾米埃尔桌宠_Qt6.app" \
            --app-drop-link 350 150 \
            "dist/RemiliaPet_Qt6-mac-x64.dmg" build/蕾米埃尔桌宠_Qt6.app/
      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-mac-x64
          path: dist/

  # ===================================================================
  # macOS ARM64
  # ===================================================================
  mac-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 通过 Homebrew 安装 Qt6
        run: |
          brew install ninja qt6
          echo "QT_PATH=$(brew --prefix qt6)" >> $GITHUB_ENV
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}"
      - name: 编译
        run: cmake --build build --parallel
      - name: 用 macdeployqt 打包 .app
        run: |
          ${{ env.QT_PATH }}/bin/macdeployqt build/蕾米埃尔桌宠_Qt6.app -verbose=1
      - name: 创建 DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg --volname "蕾米埃尔桌宠" --volicon icon.icns \
            --window-pos 200 120 --window-size 500 360 \
            --icon-size 100 --icon "蕾米埃尔桌宠_Qt6.app" 150 150 \
            --hide-extension "蕾米埃尔桌宠_Qt6.app" \
            --app-drop-link 350 150 \
            "dist/RemiliaPet_Qt6-mac-arm64.dmg" build/蕾米埃尔桌宠_Qt6.app/
      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-mac-arm64
          path: dist/

  # ===================================================================
  # Linux x86_64
  # ===================================================================
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖 + Qt6 + GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libpulse-dev libasound2-dev \
            qt6-base-dev qt6-multimedia-dev qt6-wayland libqt6svg6-dev \
            python3-pil \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release
      - name: 编译
        run: cmake --build build --parallel
      - name: 创建 AppImage + tar.gz
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage appimagetool*.AppImage
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/remilia-pet.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Remilia Pet
          Comment=Remilia Pet Qt6
          Exec=蕾米埃尔桌宠_Qt6
          Icon=remilia-pet
          Categories=Utility;
          Terminal=false
          EOF
          python3 -c "from PIL import Image; img = Image.open('icon.png'); img.resize((256,256), Image.LANCZOS).save('AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png')"
          export GST_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/gstreamer-1.0
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/蕾米埃尔桌宠_Qt6 \
            --desktop-file AppDir/usr/share/applications/remilia-pet.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png \
            --plugin qt
          cp -r /usr/lib/x86_64-linux-gnu/gstreamer-1.0 AppDir/usr/lib/
          sed -i '2i export GST_PLUGIN_SYSTEM_PATH=' AppDir/AppRun
          sed -i '2i export APPIMAGE_EXTRACT_AND_RUN=1' AppDir/AppRun
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir RemiliaPet_Qt6-linux-x64.AppImage
          tar -czf RemiliaPet_Qt6-linux-x64.tar.gz -C AppDir .
          ls -la RemiliaPet_Qt6-linux-x64.*
      - name: 上传 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-linux-x64
          path: RemiliaPet_Qt6-linux-x64.AppImage
      - name: 上传 tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-linux-x64-targz
          path: RemiliaPet_Qt6-linux-x64.tar.gz

  # ===================================================================
  # Linux ARM64
  # ===================================================================
  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖 + Qt6 + GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libpulse-dev libasound2-dev \
            qt6-base-dev qt6-multimedia-dev qt6-wayland libqt6svg6-dev \
            python3-pil \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release
      - name: 编译
        run: cmake --build build --parallel
      - name: 创建 AppImage + tar.gz
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x linuxdeploy*.AppImage appimagetool*.AppImage
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/remilia-pet.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Remilia Pet
          Comment=Remilia Pet Qt6
          Exec=蕾米埃尔桌宠_Qt6
          Icon=remilia-pet
          Categories=Utility;
          Terminal=false
          EOF
          python3 -c "from PIL import Image; img = Image.open('icon.png'); img.resize((256,256), Image.LANCZOS).save('AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png')"
          export GST_PLUGIN_PATH=/usr/lib/aarch64-linux-gnu/gstreamer-1.0
          ./linuxdeploy-aarch64.AppImage --appdir AppDir --executable build/蕾米埃尔桌宠_Qt6 \
            --desktop-file AppDir/usr/share/applications/remilia-pet.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/remilia-pet.png \
            --plugin qt
          cp -r /usr/lib/aarch64-linux-gnu/gstreamer-1.0 AppDir/usr/lib/
          sed -i '2i export GST_PLUGIN_SYSTEM_PATH=' AppDir/AppRun
          sed -i '2i export APPIMAGE_EXTRACT_AND_RUN=1' AppDir/AppRun
          ARCH=aarch64 ./appimagetool-aarch64.AppImage AppDir RemiliaPet_Qt6-linux-arm64.AppImage
          tar -czf RemiliaPet_Qt6-linux-arm64.tar.gz -C AppDir .
          ls -la RemiliaPet_Qt6-linux-arm64.*
      - name: 上传 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-linux-arm64
          path: RemiliaPet_Qt6-linux-arm64.AppImage
      - name: 上传 tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: RemiliaPet_Qt6-linux-arm64-targz
          path: RemiliaPet_Qt6-linux-arm64.tar.gz

  # ===================================================================
  # Release
  # ===================================================================
  release:
    name: 发布
    needs: [win-x64, mac-x64, mac-arm64, linux-x64, linux-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RemiliaPet_Qt6-**
          merge-multiple: true
      - name: 列出构件
        run: ls -la
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RemiliaPet_Qt6-*
          draft: false
          prerelease: false
          make_latest: true
