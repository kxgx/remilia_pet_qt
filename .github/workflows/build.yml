name: Cross-Platform Build (Dynamic)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Windows x64 — aqtinstall Qt6 → windeployqt
  # ═══════════════════════════════════════════════════════════════════
  win-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 -m qtmultimedia -O C:/Qt

      - name: Configure
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.8.2/msvc2022_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: windeployqt
        run: |
          C:/Qt/6.8.2/msvc2022_64/bin/windeployqt build/Release/蕾米埃尔桌宠_Qt6.exe --release --no-translations

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 蕾米埃尔桌宠_Qt6-win-x64
          path: build/Release/

  # ═══════════════════════════════════════════════════════════════════
  # [DISABLED] Windows ARM64 — aqtinstall 不提供 ARM64 的 Qt 包
  # ═══════════════════════════════════════════════════════════════════
  # win-arm64:
  #   runs-on: windows-11-arm
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Install Qt6 via aqtinstall
  #       run: |
  #         pip install aqtinstall
  #         aqt install-qt windows desktop 6.9.0 win64_msvc2022_64 -O C:/Qt
  #         aqt install-qt windows desktop 6.9.0 win64_msvc2022_arm64 -m qtmultimedia -O C:/Qt
  #
  #     - name: Configure
  #       run: |
  #         cmake -B build -S . -G "Visual Studio 17 2022" -A ARM64 `
  #           -DCMAKE_PREFIX_PATH="C:/Qt/6.9.0/win64_msvc2022_arm64"
  #
  #     - name: Build
  #       run: cmake --build build --config Release --parallel
  #
  #     - name: windeployqt
  #       run: |
  #         C:/Qt/6.9.0/win64_msvc2022_arm64/bin/windeployqt build/Release/蕾米埃尔桌宠_Qt6.exe --release --no-translations
  #
  #     - name: Upload artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: 蕾米埃尔桌宠_Qt6-win-arm64
  #         path: build/Release/

  # ═══════════════════════════════════════════════════════════════════
  # [DISABLED] macOS x86_64 (Intel) — macos-13 runner 资源紧张，几乎无法调度
  # ═══════════════════════════════════════════════════════════════════
  # mac-x64:
  #   runs-on: macos-13
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Install Qt6 via Homebrew
  #       run: |
  #         brew install ninja qt6
  #         echo "QT_PATH=$(brew --prefix qt6)" >> $GITHUB_ENV
  #
  #     - name: Configure
  #       run: |
  #         cmake -B build -S . -G "Ninja" \
  #           -DCMAKE_BUILD_TYPE=Release \
  #           -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}"
  #
  #     - name: Build
  #       run: cmake --build build --parallel
  #
  #     - name: Package .app with macdeployqt
  #       run: |
  #         ${{ env.QT_PATH }}/bin/macdeployqt build/蕾米埃尔桌宠_Qt6.app -verbose=1
  #         mkdir -p dist && mv build/蕾米埃尔桌宠_Qt6.app dist/
  #
  #     - name: Upload artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: 蕾米埃尔桌宠_Qt6-mac-x64
  #         path: dist/

  # ═══════════════════════════════════════════════════════════════════
  # macOS ARM64 (Apple Silicon) — Homebrew Qt
  # ═══════════════════════════════════════════════════════════════════
  mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 via Homebrew
        run: |
          brew install ninja qt6
          echo "QT_PATH=$(brew --prefix qt6)" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Package .app with macdeployqt
        run: |
          ${{ env.QT_PATH }}/bin/macdeployqt build/蕾米埃尔桌宠_Qt6.app -verbose=1
          mkdir -p dist && mv build/蕾米埃尔桌宠_Qt6.app dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 蕾米埃尔桌宠_Qt6-mac-arm64
          path: dist/

  # ═══════════════════════════════════════════════════════════════════
  # Linux x86_64 — apt Qt6
  # ═══════════════════════════════════════════════════════════════════
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libpulse-dev libasound2-dev \
            qt6-base-dev qt6-multimedia-dev libqt6svg6-dev

      - name: Configure
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 蕾米埃尔桌宠_Qt6-linux-x64
          path: build/蕾米埃尔桌宠_Qt6

  # ═══════════════════════════════════════════════════════════════════
  # Linux ARM64 — apt Qt6
  # ═══════════════════════════════════════════════════════════════════
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libpulse-dev libasound2-dev \
            qt6-base-dev qt6-multimedia-dev libqt6svg6-dev

      - name: Configure
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 蕾米埃尔桌宠_Qt6-linux-arm64
          path: build/蕾米埃尔桌宠_Qt6

  # ═══════════════════════════════════════════════════════════════════
  # Create GitHub Release on tag push
  # ═══════════════════════════════════════════════════════════════════
  release:
    needs: [win-x64, mac-arm64, linux-x64, linux-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 蕾米埃尔桌宠_Qt6-*
          merge-multiple: true

      - name: Package artifacts
        run: |
          for dir in 蕾米埃尔桌宠_Qt6-*; do
            if [ -d "$dir" ]; then
              zip -r "${dir}.zip" "$dir"
            elif [ -f "$dir" ]; then
              zip "${dir}.zip" "$dir"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: 蕾米埃尔桌宠_Qt6-*.zip
          draft: true
