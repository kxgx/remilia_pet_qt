# Flatpak manifest — 蕾米埃尔桌宠（CI 构建自当前检出目录）
app-id: io.github.kxgx.remiliapet
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: remilia-pet
rename-desktop-file: remilia-pet.desktop
rename-icon: remilia-pet
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: remilia-pet
    buildsystem: cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../.. # dir 源相对 manifest 所在目录（deploy/linux）解析，../.. 即仓库根
